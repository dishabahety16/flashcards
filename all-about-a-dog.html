<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All About a Dog — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a2332; --paper: #f6f3ee; --accent: #2d5a7b; --accent-light: #e8f0f6;
    --muted: #7a8694; --border: #d6cfc4; --card-bg: #ffffff; --flip-bg: #2d5a7b;
    --flip-text: #f0f6fa; --radius: 12px; --shadow: 0 2px 20px rgba(26,35,50,0.08);
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; background: var(--paper);
    color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem 1rem 2rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; max-width: 600px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem;
  }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.25rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-align: right;
  }
  .card-scene {
    width: 100%; max-width: 560px; height: 320px; perspective: 900px;
    margin-bottom: 1.25rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 2rem 2.25rem;
    text-align: center; box-shadow: var(--shadow); overflow-y: auto;
  }
  .card-front { background: var(--card-bg); border: 1px solid var(--border); }
  .card-back { background: var(--flip-bg); color: var(--flip-text); transform: rotateY(180deg); }
  .card-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.75rem; opacity: 0.5;
  }
  .card-front .card-label { color: var(--accent); }
  .card-back .card-label { color: var(--flip-text); }
  .card-text { font-size: 1.1rem; line-height: 1.55; }
  .tap-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); margin-top: auto; padding-top: 0.75rem; opacity: 0.6;
  }
  .card.flipped .card-front .tap-hint { visibility: hidden; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); padding: 0.55rem 1.1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { background: var(--card-bg); border-color: var(--border); }
  .btn-shuffle { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 0.78rem; }
  .btn-shuffle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .kbd-hints {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); opacity: 0.5;
  }
  .kbd-hints kbd {
    font-family: inherit; background: var(--card-bg); border: 1px solid var(--border);
    padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.65rem;
  }
  @media (max-width: 480px) {
    .card-scene { height: 290px; }
    .card-face { padding: 1.5rem 1.25rem; }
    .card-text { font-size: 1rem; }
    header h1 { font-size: 1.15rem; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>All About a Dog</h1>
  <p>A.G. Gardiner — 51 Flashcards</p>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="questionText"></div>
      <div class="tap-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answerText"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">&#8592; Prev</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn" id="nextBtn" onclick="next()">Next &#8594;</button>
</div>
<div class="kbd-hints">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &middot; <kbd>Space</kbd> flip
</div>
<script>
const DATA = [
["Who is the author of the short story \"All About a Dog\"?", "A.G. Gardiner."],
["Besides being an essayist, in what other professional field was A.G. Gardiner well-known?", "Journalism."],
["What is the primary setting of the story?", "A bus on a bitterly cold night."],
["What specific breed of dog causes the conflict in the story?", "A Pekinese dog."],
["How is the wind described at the beginning of the story?", "An east wind that \"cut like a knife\"."],
["What was the younger woman wearing that often signals a high social status in the text?", "Sealskin."],
["What literary label does the narrator apply to the conductor, citing Mr. Wells?", "The Resentful Employee."],
["According to the narrator, what characterizes the \"Resentful Employee\"?", "A general vague grievance against everything and a particular grievance against passengers."],
["Why did the conductor have a particular grievance against the passengers?", "They sat in his seat while he had to shiver at the door."],
["What was the conductor's specific demand regarding the Pekinese dog?", "The woman must take the dog out of the bus."],
["What alternative did the woman offer the conductor instead of leaving the bus?", "Her name and address."],
["Why did the woman refuse to sit on the top deck with her dog?", "She had a cough and the harsh weather would endanger her life."],
["What action did the conductor take to halt the journey?", "He pulled the bell to stop the bus and stepped onto the pavement."],
["How did the conductor view his moment of stopping the bus?", "As a moment of triumph with the law on his side."],
["What was the general attitude of the passengers toward the conductor's actions?", "They were angry and sided with the lady and the dog."],
["What was the dog's reaction to the heated argument occurring around it?", "It sat blinking at the lights in happy unconsciousness of the rumpus."],
["How did the conductor react when a passenger asked for his number?", "He provided it imperturbably."],
["What was the conductor's response when passengers demanded their fares back?", "\"No fares back.\""],
["What did the driver do while the bus was stopped during the standoff?", "He remained in his seat and beat his arms across his chest for warmth."],
["How did the policeman respond to the passengers' appeals against the conductor?", "He stated that the conductor \"had his rules\"."],
["To what did the narrator compare the conductor as he walked to and fro on the pavement?", "A captain on the quarterdeck in the hour of victory."],
["What was the final outcome of the first standoff regarding the lady's position?", "She eventually surrendered and went to the top deck."],
["What mechanical issue occurred after the bus finally restarted?", "The engine \"struck work\" or failed."],
["What did the lady with the dog do while the engine was being repaired?", "She stole down the stairs and re-entered the bus."],
["What triggered the second standoff between the conductor and the woman?", "The conductor saw the dog inside the bus after the engine was fixed."],
["How does the narrator distinguish \"hard and fast\" rules?", "They are rules that cannot be broken without danger to life and limb."],
["What is the narrator's example of a \"hard and fast\" rule?", "The rule of the road."],
["According to the narrator, what is the nature of the rule regarding dogs on buses?", "It is a rule for guidance to be applied with common sense."],
["The narrator claims rules should be observed in the _____ rather than the letter.", "Spirit."],
["According to the narrator, what should rules be mixed with for better implementation?", "Goodwill and good temper."],
["How did the conductor respond to the narrator's advice at the end of the story?", "He took it well and said \"Good night\" amiably."],
["What major theme explores the tension between enforcing regulations and showing empathy?", "Rigidity versus compassion."],
["The story highlights how authority can be challenged by _____.", "Common man or ordinary individuals."],
["What does the sealskin lady's lady companion say to support her refusal to go upstairs?", "She mentions that the lady already has a cough."],
["What phrase did the passengers use to describe the driver's support for the conductor?", "\"They stick by each other.\""],
["The narrator notes that rules are not a _____ to scourge passengers with.", "Whip."],
["How did the \"dashing young fellow\" behave when the standoff persisted?", "He slipped away despite having previously declared he would stay all night."],
["What is the narrator's ultimate critique of the conductor's behaviour?", "He kept the rule but broke its spirit."],
["What term describes the lady's final transition from resistance to the top deck?", "Abject surrender."],
["The bus conductor's \"cold malice\" was directed at which specific feature of the dog?", "Its beady eyes."],
["According to the transcript, why should rules be framed for the greater good?", "To ensure they do not cause inconvenience or harm to the common public."],
["What was the narrator's role in the conflict?", "He was a passenger and observer who eventually advised the conductor."],
["The narrator states that some rules are an authority for an _____ rather than a tool for punishment.", "Emergency."],
["In the story, what did the conductor do after the lady finally went upstairs the second time?", "He stood \"sourly triumphant\" as he was discussed by the remaining passengers."],
["How is the young woman's companion described as he left the bus with her?", "He was the \"Young man\" who had sat as a silent witness to her rage."],
["The narrator tells the conductor that rules are meant for the _____ of the passengers.", "Comfort."],
["What metaphorical description is used for the policemen watching the scene?", "A group of statuary."],
["Why did the conductor think he had the \"opportunity for which he had been waiting\"?", "He could exercise his power over passengers using a technicality of the rules."],
["Which character is described as \"immovable as cold as the night and as hard as the pavement\"?", "The conductor."],
["The conflict in the story is reignited because the dog happens to _____.", "Come downstairs."],
["According to the Aspiring Minds transcript, the conductor's change in thinking allows the system to _____.", "Restart or reboot."]
];
let order = [...Array(DATA.length).keys()];
let idx = 0;
const card = document.getElementById('card');
const qText = document.getElementById('questionText');
const aText = document.getElementById('answerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
function render() {
  const i = order[idx];
  qText.textContent = DATA[i][0];
  aText.textContent = DATA[i][1];
  card.classList.remove('flipped');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === order.length - 1;
  const pct = ((idx + 1) / order.length * 100).toFixed(0);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = (idx + 1) + ' / ' + order.length;
}
function flip() { card.classList.toggle('flipped'); }
function next() { if (idx < order.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; render();
}
document.getElementById('cardScene').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
