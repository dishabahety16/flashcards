<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Python Unit 1 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>BCA Python &mdash; Unit 1</h1>
<p class="subtitle">63 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Who is credited with conceiving the Python programming language in the late 1980s?", "Guido van Rossum"], ["In which month and year did the actual usage of Python begin?", "December 1989"], ["What was the significance of the release of Python 3.0 in late 2008 regarding older codebases?", "It was not backward compatible, requiring developers to update their existing code."], ["Python was named after which British comedy group?", "Monty Python"], ["Term: Interpreted Language", "Definition: A language where the code is executed line-by-line by an interpreter rather than being compiled into machine code beforehand."], ["In Python, a variable's type is determined at runtime rather than being declared explicitly. This means Python is _____ typed.", "dynamically"], ["Which Python web framework is described as a 'batteries-included', high-level framework that includes an ORM and admin panel?", "Django"], ["Which lightweight Python 'micro-framework' is designed for flexibility and small-scale services or APIs?", "Flask"], ["What is the primary Python library used for 2D game development, handling graphics, sound, and input?", "PyGame"], ["Which Python library provides the foundation for numerical computing by offering efficient multi-dimensional arrays?", "NumPy"], ["Term: Web Scraping", "Definition: The automated process of extracting information from websites by parsing their HTML or XML content."], ["Which Python library is specifically used to parse HTML and XML documents to navigate the document tree?", "BeautifulSoup"], ["In the context of AI and Machine Learning, which two frameworks are leading choices for building neural networks in Python?", "TensorFlow and PyTorch"], ["What hardware platform commonly uses Python for embedded applications and IoT projects?", "Raspberry Pi"], ["In a Python program, what is the purpose of the 'shebang' line ($#! /usr/bin/python$)?", "It ensures compatibility with Unix-based systems by specifying the interpreter location."], ["What syntax feature does Python use instead of curly braces to define blocks of code?", "Indentation (white space)"], ["According to the PEP 8 style guide, how many spaces are recommended per indentation level in Python?", "4 spaces"], ["Rule: Python Identifiers", "Definition: Names for variables, functions, or classes that must start with a letter or underscore and cannot start with a digit."], ["If you have two identifiers named 'total' and 'Total', how does Python treat them?", "As two distinct identifiers, because Python is case-sensitive."], ["Which three Python keywords are the only ones that begin with a capital letter?", "True, False, and None"], ["What type of error is triggered if a programmer attempts to use a reserved keyword as a variable name?", "SyntaxError"], ["Concept: Floor Division", "Symbol: $//$. Function: Divides two numbers and returns the largest integer less than or equal to the result."], ["What is the result of the expression $7 \\% 2$ in Python?", "1 (the remainder of the division)"], ["Which operator is used to calculate the result of one number raised to the power of another ($a^b$)?", "$**$ (Exponentiation)"], ["The _____ operator is used to check if two variables refer to the exact same object in memory.", "identity (is)"], ["Which operators are used to check if a specific value exists within a sequence like a list or a string?", "Membership operators (in, not in)"], ["According to operator precedence, which operator is unique for being right-to-left associative?", "The exponentiation operator ($**$)"], ["In an expression with multiple operators, which symbol can a programmer use to explicitly override default precedence?", "Parentheses ()"], ["Data Type: int", "Definition: Represents whole numbers of any size, limited only by the available memory of the machine."], ["Data Type: float", "Definition: Represents real numbers containing a decimal point, typically stored using 64-bit double-precision."], ["In Python, the 'bool' data type treats the value 'True' as equivalent to the integer _____ in numeric contexts.", "1.0"], ["What term describes a data type, such as a string, that cannot be modified in place once it has been created?", "Immutable"], ["The process where the Python interpreter automatically converts one data type to another during a calculation is known as _____ conversion.", "implicit (or type coercion)"], ["What happens to the fractional part of a float when it is converted to an integer using the $int()$ function?", "It is truncated (dropped), not rounded."], ["Why does the expression $int('25.5')$ result in a ValueError?", "Because the string contains a decimal point, and $int()$ only converts strings that represent whole integers."], ["How does an 'expression' differ from a 'statement' in Python code?", "An expression evaluates to a single value, while a statement represents an action or command for the interpreter to execute."], ["What is the default data type returned by the $input()$ function?", "String (str)"], ["Which $print()$ function parameter allows the user to specify a custom string to be displayed between multiple arguments?", "The 'sep' parameter"], ["Which $print()$ function parameter is used to change the character printed at the end of the output (defaulting to a newline)?", "The 'end' parameter"], ["What is the model of program functionality that involves gathering data, performing calculations, and displaying results?", "Input-Process-Output (I/O)"], ["Which type of quotes are used to create strings that span multiple lines and preserve line breaks?", "Triple quotes (''' or \"\"\")"], ["In string indexing, what integer refers to the very first character of the string?", "0.0"], ["In string indexing, what integer refers to the very last character of the string?", "-1.0"], ["What is the result of trying to modify a single character in a string using indexing (e.g., $s[0] = 'A'$)?", "A TypeError is raised because strings are immutable."], ["String Slicing: $[n:m]$", "The slice starts at index $n$ and ends at index $m-1$ (index $m$ is excluded)."], ["What slicing syntax is used to return a complete, reversed copy of a string?", "$[::-1]$ (a step of -1)"], ["What is the result of using the multiplication operator ($*$) on a string and an integer (e.g., $'Ab' * 3$)?", "The string is repeated that number of times ($'AbAbAb'$)."], ["Which string method combines a list of strings into a single string with a separator between them?", "The $.join()$ method"], ["What is the difference between the string methods $.find()$ and $.index()$ when the requested substring is missing?", "$.find()$ returns -1, whereas $.index()$ raises a ValueError."], ["Which string method is used to remove all leading and trailing white space from a string?", "$.strip()$"], ["Modern Python string formatting that uses an 'f' prefix and curly braces for variable names is called _____.", "f-strings (or formatted string literals)"], ["What f-string format specifier is used to display a floating-point number rounded to exactly two decimal places?", "$:.2f$"], ["In an f-string, what does the expression $f'{x=}'$ (for $x = 10$) produce?", "x=10' (self-documenting expression)"], ["What built-in function returns the total number of characters in a string?", "$len()$"], ["A _____ is the smallest individual unit in a Python program, such as a keyword or a punctuator.", "token"], ["Which punctuator is used in Python to allow multiple statements to be written on a single line?", "The semicolon ($;$)"], ["What is the result of using the $+$ operator on two strings?", "Concatenation (joining them end-to-end)."], ["What error occurs if you try to concatenate a string and an integer directly (e.g., $'Age: ' + 25$)?", "TypeError"], ["Which string method capitalises only the very first character of the entire string?", "$.capitalize()$"], ["Which string method returns 'True' only if every alphabetic character in the string is lowercase?", "$.islower()$"], ["In string slicing, what is the default 'step' value if it is not explicitly provided?", "1.0"], ["What is the primary function of the $.replace(\"old\", \"new\")$ method?", "It returns a new string with all occurrences of the \"old\" substring substituted with the \"new\" one."], ["Python is described as a 'multi-paradigm' language. Which three programming styles does it explicitly support?", "Procedural, object-oriented, and functional."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
