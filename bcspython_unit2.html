<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCs Python Unit 2 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>B.Cs Python &mdash; Unit 2</h1>
<p class="subtitle">85 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["What three properties define a Python List?", "Lists are ordered, mutable, and heterogeneous collections."], ["Which symbol is used to define a list literal in Python?", "Square brackets $[ ]$."], ["What is the term for a data structure like a list that can grow or shrink during program execution?", "Dynamic array."], ["In a list of $n$ elements, what is the valid range for positive indices?", "From $0$ to $n - 1$."], ["Which index refers to the very last element of a list using negative indexing?", "The index $-1$."], ["What specific error is raised when attempting to access a list index that does not exist?", "IndexError."], ["List indices must be of the _____ data type; otherwise, a TypeError is raised.", "Integer"], ["What is the syntax for the basic Python slicing operator?", "$[start:stop:step]$."], ["How do you access the element at the second position of a list nested inside the first position of list $L$?", "Using the syntax $L[0][1]$."], ["Which list method adds a single element to the very end of the collection?", "The $append()$ method."], ["What is the difference between the $append()$ and $extend()$ methods in a list?", "$append()$ adds one item, while $extend()$ adds all items from an iterable."], ["Which list method allows you to insert an item at a specific, defined index?", "The $insert()$ method."], ["How can you delete the entire list object named $my\\_list$ from memory?", "Using the keyword $del\\ my\\_list$."], ["Which list method removes the first occurrence of a specific value and raises a ValueError if the value is absent?", "The $remove()$ method."], ["What does the $pop()$ method return if no index is provided as an argument?", "It removes and returns the last element of the list."], ["Which list method is used to remove all elements, leaving the list empty?", "The $clear()$ method."], ["What is the return value of the $list.sort()$ method?", "It returns $None$ because it sorts the list in-place."], ["How does the $sorted(lst)$ function differ from the $lst.sort()$ method?", "$sorted()$ returns a new sorted list, while $sort()$ modifies the original list."], ["Which operator is used to combine or concatenate two lists into a new list?", "The $+$ operator."], ["What is the result of the expression $[ 're' ] * 3$?", "$['re', 're', 're']$."], ["Which keyword is used to check if a specific element exists within a list?", "The $in$ membership operator."], ["What built-in function returns the total number of items in a list?", "The $len()$ function."], ["Which function returns $True$ only if every element in a list evaluates to $True$?", "The $all()$ function."], ["What is the purpose of the $enumerate()$ function when used with a list?", "It returns an iterable of tuples containing the index and value for each element."], ["What operator allows you to unpack a list into individual elements inside another list declaration?", "The asterisk $*$ operator."], ["What are the three components found inside the brackets of a list comprehension?", "An expression, a for clause, and an optional if condition."], ["What two properties characterize a Tuple?", "Tuples are ordered and immutable collections."], ["How must you define a tuple containing exactly one element, such as the integer $10$?", "By including a trailing comma: $(10,)$."], ["What happens if you define $x = (10)$ without a trailing comma?", "Python treats $x$ as a simple integer rather than a tuple."], ["The process of assigning multiple values to a single variable name to create a tuple is called tuple _____.", "Packing"], ["What is the requirement for the number of variables on the left side during tuple unpacking?", "The number of variables must equal the number of items in the tuple."], ["Which error is raised when you try to modify an element of a tuple after it has been created?", "TypeError."], ["Under what condition can the contents of an object 'inside' a tuple be changed?", "If the specific element is a mutable object, such as a list."], ["Which two methods are the only ones available for tuple objects?", "The $index()$ and $count()$ methods."], ["What data type is returned by the $sorted()$ function when it is passed a tuple as an argument?", "A list."], ["What is created when you use a comprehension-style syntax inside parentheses $()$ instead of square brackets?", "A generator expression."], ["How can you convert a generator expression into an actual tuple?", "By passing the generator expression to the $tuple()$ constructor."], ["What is the primary advantage of iterating over a tuple compared to a list?", "Iteration over a tuple is faster."], ["Why can tuples be used as dictionary keys while lists cannot?", "Tuples are immutable (and thus hashable), while lists are mutable."], ["Which function is used to pair elements from multiple iterables into a single iterable of tuples?", "The $zip()$ function."], ["What is a Set in Python?", "An unordered collection of unique elements."], ["Which symbol is used for set literals, and what is the caveat for empty sets?", "Curly braces $\\{ \\}$ are used; an empty set must be created using $set()$."], ["Why are elements in a set required to be of immutable data types?", "Sets use hashing, and an element's hash value must remain constant."], ["What happens to duplicate elements when they are added to a set?", "They are automatically removed; the set only stores unique values."], ["Which set method is used to add a single new item to the collection?", "The $add()$ method."], ["How does the $remove()$ method differ from the $discard()$ method in a set?", "$remove()$ raises a KeyError if the item is missing, while $discard()$ does not."], ["Which operator performs a mathematical Union between two sets?", "The pipe $|$ operator."], ["Which operator finds the common elements between two sets (Intersection)?", "The ampersand $\\& $ operator."], ["What is the result of the set Difference operation $A - B$?", "A set containing elements that are in $A$ but not in $B$."], ["Which set operation returns elements present in either set but not in both?", "Symmetric Difference (using the caret $^$ operator)."], ["The compound operator $a \\ \\|= b$ is used to perform an in-place _____ update on set $a$.", "Union"], ["What is a frozenset in Python?", "An immutable version of a set."], ["Which built-in function is used to find the maximum value in a set?", "The $max()$ function."], ["Why is it impossible to access a set element using an index like $s[0]$?", "Sets are unordered collections and do not support indexing."], ["How do you check if set $A$ is a subset of set $B$ using an operator?", "Using the $A \\le B$ operator."], ["What is a Python Dictionary?", "A collection of key-value pairs where keys must be unique and immutable."], ["In a dictionary entry $'A101' : 'Amol'$, what is the key and what is the value?", "$'A101'$ is the key, and $'Amol'$ is the value."], ["What happens in a dictionary if you assign a new value to an existing key?", "The latest value overwrites the previous value associated with that key."], ["Which dictionary method returns the value of a key but avoids a KeyError if the key is missing?", "The $get()$ method."], ["How can you check if a specific key exists in a dictionary named $d$?", "Using the expression $key\\ in\\ d$."], ["Which method is used to merge the key-value pairs of one dictionary into another?", "The $update()$ method."], ["Which dictionary method removes and returns an arbitrary (LIFO) key-value pair?", "The $popitem()$ method."], ["What dictionary method provides a view of all the keys present in the dictionary?", "The $keys()$ method."], ["What does the $items()$ method return when called on a dictionary?", "A view object containing (key, value) tuples for every entry."], ["Can a list be used as a key in a dictionary? Why or why not?", "No, because lists are mutable and keys must be hashable/immutable."], ["What is the syntax for a dictionary comprehension that squares each number from $0$ to $5$?", "$\\{x: x*x\\ for\\ x\\ in\\ range(6)\\}$."], ["Which dictionary method returns a value for a key if it exists, or inserts the key with a default value if it does not?", "The $setdefault()$ method."], ["How do you create a shallow copy of a dictionary named $original$?", "Using $original.copy()$ or $dict(original)$."], ["In Python 3.9+, what operator can be used to merge two dictionaries into a new one?", "The pipe $|$ operator."], ["Which built-in function returns the number of key-value pairs in a dictionary?", "The $len()$ function."], ["What is a 'nested dictionary'?", "A dictionary where the values themselves are other dictionaries."], ["What operator is used to unpack dictionary keys and values into a new dictionary declaration?", "The double asterisk $**$ operator."], ["Which method removes a specified key from a dictionary and returns its corresponding value?", "The $pop(key)$ method."], ["A _____ is a dictionary used by the Python interpreter to store identifiers as keys and their objects as values.", "Namespace"], ["True or False: Dictionaries can be concatenated using the $+$ operator.", "False."], ["What determines the iteration order of a dictionary in Python 3.7+?", "The insertion order of the keys."], ["Which built-in function returns a sorted list of the keys in a dictionary?", "The $sorted()$ function."], ["What is the result of $bool( [ ] )$?", "False (empty containers are falsy)."], ["Which container type is described as an unordered collection that cannot contain duplicate entries?", "A Set."], ["To create a dictionary with only the odd numbers from a range as keys, which part of the comprehension is used?", "The $if$ condition (e.g., $if\\ x\\ \\%\\ 2\\ \\ne\\ 0$)."], ["Which container type uses LIFO (Last-In, First-Out) order for its $popitem()$ method?", "Dictionary."], ["What is the primary difference between a 'Shallow Copy' and a 'Deep Copy' for nested lists?", "Shallow copy shares nested objects; deep copy creates independent duplicates of everything."], ["Which specific function returns a list of all names (methods/attributes) available for a list object?", "The $dir(list)$ function."], ["Why does a set comprehension like $\\{x\\ for\\ x\\ in\\ 'banana'\\}$ result in $\\{'b', 'a', 'n'\\}$?", "Because sets automatically eliminate duplicate characters."], ["Which container type is best suited for storing a fixed GPS coordinate (latitude, longitude)?", "A Tuple."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
