<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCs Python Unit 5 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>B.Cs Python &mdash; Unit 5</h1>
<p class="subtitle">70 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["What is the primary difference between a Syntax Error and an Exception?", "Syntax Errors occur during compilation (grammar rules), while Exceptions occur during execution (runtime)."], ["In Python, which keyword is used to manually trigger an error or exception?", "raise"], ["What is the purpose of the 'try' block in exception handling?", "To enclose code that is suspected of causing an exceptional condition at runtime."], ["Which block is used to catch and handle an exception raised within a 'try' block?", "except"], ["The _____ block executes only if no exceptions were raised in the 'try' block.", "else"], ["What is the defining characteristic of the 'finally' block?", "It executes regardless of whether an exception was raised or not."], ["At the top of Python's exception hierarchy, what is the base class from which all exceptions inherit?", "BaseException"], ["What is the most commonly used parent class when creating user-defined exceptions?", "Exception"], ["Which built-in exception is raised when a mathematical division by zero is attempted?", "ZeroDivisionError"], ["When a function receives an argument of the correct type but an inappropriate value, which exception is raised?", "ValueError"], ["What exception is triggered by applying an operation to an object of an inappropriate data type?", "TypeError"], ["Which exception occurs when an invalid index is used to access a sequence like a list?", "IndexError"], ["What is raised when a dictionary key is not found during a lookup?", "KeyError"], ["Which exception is raised when the user presses 'Ctrl+c' during program execution?", "KeyboardInterrupt"], ["In an 'except' clause, which keyword is used to assign the caught exception object to a variable name?", "as"], ["How does a 'catchall' except block (one with no specific exception named) function?", "It catches all exceptions that were not handled by previous 'except' blocks."], ["To create a custom exception, a new class must be derived from the _____ class.", "Exception"], ["What is the default recursion limit typically set to in Python?", "Approximately $10^4$"], ["Which function in the 'sys' module allows a programmer to increase the recursion limit?", "setrecursionlimit()"], ["In File I/O, what does the 'r+' mode signify?", "Opening a file for both reading and writing."], ["Which file mode is used to add data to the end of an existing file without overwriting it?", "a (append mode)"], ["How does the 'x' mode differ from the 'w' mode when opening a file?", "x' mode raises an error if the file already exists, whereas 'w' mode overwrites it."], ["What character must be appended to a file mode (e.g., 'rb') to indicate interaction with binary data?", "b"], ["Why is the 'with' keyword considered a best practice for file handling?", "It acts as a context manager that automatically closes the file, even if an exception occurs."], ["Which file method reads the entire content of a file into a single string?", "read()"], ["The method _____ reads the next single line from a file including the newline character.", "readline()"], ["What data structure does the 'f.readlines()' method return?", "A list containing each line of the file as a separate string element."], ["Which method is used to write a list of strings into a file at once?", "writelines()"], ["What is the purpose of the 'f.tell()' method?", "It returns the current position of the file pointer in bytes from the beginning of the file."], ["In the function call 'f.seek(offset, whence)', what does a 'whence' value of 2 represent?", "The reference point is the end of the file."], ["To move the file pointer 10 bytes backward from the current position, what is the syntax for 'f.seek()'?", "f.seek(-10, 1)"], ["Define 'Serialization' in the context of Python data.", "The process of converting a Python object into a byte stream or format (like JSON) for storage or transmission."], ["Which 'json' module function is used to serialize an object and write it directly to a file?", "json.dump()"], ["What is the difference between 'json.loads()' and 'json.load()'?", "json.loads()' parses a JSON string, while 'json.load()' reads and parses JSON data from a file object."], ["True or False: User-defined classes are JSON serializable by default without custom encoding functions.", "False"], ["Which 'os' module function is used to change the name of a file or directory?", "os.rename()"], ["What does the 'os.path.exists()' function return?", "A Boolean value (True if the path exists, False otherwise)."], ["Which function provides the absolute path version of a relative file path?", "os.path.abspath()"], ["Which list in the 'sys' module contains the command-line arguments passed to a script?", "sys.argv"], ["In the list 'sys.argv', what is always stored at index 0?", "The name of the Python script itself."], ["What is the purpose of the 'assert' statement?", "To check if a condition is true and raise an 'AssertionError' if it is false, primarily for debugging."], ["What is a Python 'Decorator'?", "A function that receives another function as an argument, adds functionality, and returns a new function."], ["Which built-in decorator is used to define an abstract method in an abstract base class?", "@abstractmethod"], ["How do '@classmethod' and '@staticmethod' differ from regular instance methods?", "They are defined within a class namespace but are not bound to a specific instance of that class."], ["Which method must be called to begin the execution of a 'threading.Thread' object?", "start()"], ["What is the risk of calling the 'start()' method more than once on the same thread object?", "It raises a 'RuntimeError'."], ["In multithreading, how does a 'Lock' differ from an 'RLock'?", "An 'RLock' (reentrant lock) can be acquired multiple times by the same thread, whereas a standard 'Lock' cannot."], ["Which method of the 'threading.Event' object is used to wake up all threads waiting for the internal flag?", "set()"], ["What is the function of the 'wait()' method in a 'Condition' object?", "It releases the lock and blocks the thread until it is awakened by a 'notify()' or 'notifyAll()' call."], ["Which keyword is used to provide an alternative path when an 'if' condition is false?", "else"], ["What is the 'else' block's behavior when used with a 'while' or 'for' loop?", "It executes when the loop terminates normally, but not if the loop is terminated by a 'break' statement."], ["The _____ statement is used as a 'no-op' or placeholder when a statement is syntactically required but no action is needed.", "pass"], ["Which built-in function is used to determine if a variable is an instance of a specific class or type?", "isinstance()"], ["What is the purpose of the 'dir()' function when applied to an object or module?", "It returns a list of valid attributes and methods for that object or module."], ["In the context of inheritance, what is the 'super()' function used for?", "To call methods of the base (parent) class from within the derived (child) class."], ["Which method resolution attribute shows the linearization search order for classes in multiple inheritance?", "__mro__"], ["What is the standard name for the file that must exist in a directory for Python to treat it as a 'package'?", "__init__.py"], ["Which variable in the 'sys' module stores the list of directories where Python searches for modules?", "sys.path"], ["What does the '__name__' variable equal when a Python script is run directly as the main program?", "__main__'"], ["Define 'Duck Typing' as implied by Python's dynamic nature.", "The type of a variable is determined at runtime based on its usage rather than being explicitly declared."], ["Which built-in function returns a unique integer identifier (memory address) for an object?", "id()"], ["In an 'f.seek(offset, whence)' call, what does a 'whence' value of 1 indicate?", "The offset is relative to the current file pointer position."], ["Which 'os' module function creates a new directory at the specified path?", "os.mkdir()"], ["The function 'os.listdir()' returns a _____ containing the names of entries in the given directory.", "list"], ["What exception is raised by the 'next()' function to signal that an iterator has no more items?", "StopIteration"], ["Which module must be imported to use 'Semaphore' or 'Condition' for thread synchronization?", "threading"], ["What is the purpose of the 'json.dumps()' function?", "To convert a Python object into a JSON-formatted string."], ["If a 'try' block contains a 'return' statement and there is a 'finally' block, which 'return' value takes precedence if the 'finally' also has one?", "The 'return' value in the 'finally' block."], ["Which function allows you to get help documentation for a specific built-in function or module?", "help()"], ["What does the 'os.path.join()' function do?", "It intelligently concatenates path components using the correct directory separator for the operating system."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
