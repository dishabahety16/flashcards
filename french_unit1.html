<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Unit 1 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>French &mdash; Unit 1</h1>
<p class="subtitle">100 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Quelles sont les six voyelles de la langue française ?", "a, e, i, o, u, y"], ["Quel accent s'utilise uniquement sur la lettre 'é' ?", "L'accent aigu"], ["Donnez trois exemples de mots utilisant l'accent aigu ($é$).", "café, école, été"], ["Sur quelles voyelles peut-on trouver l'accent grave ?", "è, à, ù"], ["Quelle est la fonction de l'accent grave sur les lettres 'à' et 'ù' ?", "Il sert à distinguer le sens des mots (ex: 'là' vs 'la')."], ["Comment s'appelle l'accent présent sur les voyelles â, ê, î, ô, û ?", "L'accent circonflexe"], ["Quel est le rôle du tréma ($ë, ï, ü$) ?", "Il indique que deux voyelles doivent se prononcer séparément."], ["Où place-t-on la cédille ($ç$) et quel son produit-elle ?", "Sous la lettre 'c' devant a, o, u pour donner le son $[s]$."], ["Identifiez l'erreur : 'Il va a l'école'.", "Il faut un accent grave sur le 'à' (préposition)."], ["Écrivez le chiffre 4 en lettres.", "quatre"], ["Écrivez le chiffre 8 en lettres.", "huit"], ["Traduisez en français le signe de calcul $+$ .", "plus"], ["Traduisez en français le signe de calcul $-$ .", "moins"], ["Traduisez en français le signe de calcul $\\times$ .", "multiplié par"], ["Traduisez en français le signe de calcul $\\div$ .", "divisé par"], ["Traduisez en français le signe $=$ .", "égal"], ["Calculez et écrivez le résultat en lettres : $3 + 5 =$ _____", "huit"], ["Calculez et écrivez le résultat en lettres : $10 - 3 =$ _____", "sept"], ["Calculez et écrivez le résultat en lettres : $2 \\times 3 =$ _____", "six"], ["Épelez le nombre 5 en français.", "c-i-n-q"], ["Quel pronom sujet utilise-t-on pour parler de soi-même ?", "Je"], ["Quel pronom sujet correspond à 'You' au singulier et familier ?", "Tu"], ["Quelle est la différence entre 'Il' et 'Elle' ?", "Il' est masculin singulier et 'Elle' est féminin singulier."], ["Quel pronom neutre est souvent utilisé à l'oral à la place de 'Nous' ?", "On"], ["Quel pronom sujet utilise-t-on pour s'adresser à un groupe ou par politesse ?", "Vous"], ["Quel pronom sujet utilise-t-on pour un groupe mixte (hommes et femmes) ?", "Ils"], ["Conjuguez le verbe être au présent avec 'Je'.", "Je suis"], ["Conjuguez le verbe être au présent avec 'Nous'.", "Nous sommes"], ["Conjuguez le verbe être au présent avec 'Vous'.", "Vous êtes"], ["Comment dit-on 'Hello' ou 'Good morning' de manière standard ?", "Bonjour"], ["Quel mot familier signifie à la fois 'Hi' et 'Bye' ?", "Salut"], ["Comment salue-t-on quelqu'un le soir ?", "Bonsoir"], ["Traduisez : 'See you tomorrow'.", "À demain"], ["Quelle expression utilise-t-on pour dire 'Please' formellement ?", "S'il vous plaît"], ["Comment répond-on poliment à 'Merci' ?", "De rien"], ["Que dit-on pour s'excuser poliment d'avoir dérangé quelqu'un ?", "Excusez-moi"], ["Que dit-on quand on fait la connaissance de quelqu'un ?", "Enchanté(e)"], ["Quelle est la question formelle pour demander le nom de quelqu'un ?", "Comment vous appelez-vous ?"], ["Traduisez : 'I am a student' (féminin).", "Je suis étudiante."], ["Citez les sept jours de la semaine dans l'ordre.", "Lundi, Mardi, Mercredi, Jeudi, Vendredi, Samedi, Dimanche"], ["Quel jour de la semaine précède le Mercredi ?", "Mardi"], ["Quel jour vient après le Vendredi ?", "Samedi"], ["Comment dit-on 'Today' en français ?", "Aujourd'hui"], ["Traduisez : 'Yesterday was Sunday'.", "Hier c'était dimanche."], ["Quels sont les deux jours du week-end ?", "Samedi et dimanche"], ["Citez les trois premiers mois de l'année.", "Janvier, février, mars"], ["Quel est le dernier mois de l'année ?", "Décembre"], ["Comment dit-on 'school' et 'teacher' (masculin) en français ?", "l'école et le professeur"], ["Traduisez les membres de la famille : father, mother, brother, sister.", "père, mère, frère, sœur"], ["Comment appelle-t-on les verbes qui se terminent par -ER ?", "Les verbes du premier groupe (ou verbes réguliers en -ER)."], ["Quelle est la terminaison du verbe 'parler' avec le pronom 'Nous' ?", "parlons"], ["Conjuguez le verbe 'habiter' avec 'Tu'.", "Tu habites"], ["Quelle est l'abréviation de 'Monsieur' ?", "M."], ["Que signifie l'abréviation 'av.' ?", "avenue"], ["Quelle est l'abréviation de 'Mademoiselle' ?", "Mlle"], ["Comment dit-on 'I live in Chennai' ?", "J'habite à Chennai."], ["Quelle est la structure pour dire son âge en français ?", "Sujet + verbe avoir + nombre + ans (ex: J'ai 20 ans)."], ["Mettez au féminin la nationalité 'Indien'.", "Indienne"], ["Mettez au féminin la nationalité 'Français'.", "Française"], ["Traduisez : 'She is Italian'.", "Elle est italienne."], ["Citez trois États voisins de la France situés à l'Est.", "L'Allemagne, la Suisse, l'Italie"], ["Quel pays se trouve au Sud-Ouest de la France ?", "L'Espagne"], ["Quel pays se trouve au Nord de la France ?", "La Belgique"], ["Nommez deux villes françaises célèbres en dehors de Paris.", "Lyon, Marseille, Nice (deux au choix)"], ["Quel monument est le symbole de Paris ?", "La Tour Eiffel"], ["Où se trouve le musée du Louvre ?", "À Paris"], ["Qu'est-ce que le Mont-Saint-Michel ?", "Un site touristique célèbre situé en Normandie."], ["Quel accent transforme le son 'c' $[k]$ en $[s]$ ?", "La cédille ($ç$)"], ["Comment dit-on 'I am sorry, I am late' ?", "Je suis désolé(e), je suis en retard."], ["Quel mot utilise-t-on pour souhaiter un bon repas ?", "Bon appétit"], ["Traduisez : 'The book is on the table'.", "Le livre est sur la table."], ["Comment dit-on 'Welcome' pour accueillir quelqu'un ?", "Bienvenue"], ["Complétez la suite logique : un, deux, trois, _____, cinq.", "quatre"], ["Quelle préposition utilise-t-on devant un nom de ville (ex: Paris) ?", "à (ex: à Paris)"], ["Quelle préposition utilise-t-on devant un pays féminin (ex: France) ?", "en (ex: en France)"], ["Comment dit-on 'Good night' avant d'aller dormir ?", "Bonne nuit"], ["Quel pronom sujet utilise-t-on pour un groupe composé uniquement de femmes ?", "Elles"], ["Traduisez : 'Eight divided by two equals four'.", "Huit divisé par deux égal quatre."], ["Comment dit-on 'Excuse me' de manière familière (tutoiement) ?", "Excuse-moi"], ["Quel jour de la semaine commence par la lettre 'J' ?", "Jeudi"], ["Traduisez : 'Today is Monday'.", "Aujourd'hui, nous sommes lundi."], ["Quel pronom français correspond au 'You' pluriel ?", "Vous"], ["Comment se dit le chiffre 0 en français ?", "zéro"], ["Si aujourd'hui est samedi, quel jour est demain ?", "Dimanche"], ["Quel mot français signifie 'My name is' ?", "Je m'appelle"], ["Comment dit-on 'See you soon' ?", "À bientôt"], ["Dans la phrase 'Il est indien', quel est le verbe ?", "est (verbe être)"], ["Comment dit-on 'market' en français ?", "marché"], ["Traduisez : 'I study French'.", "J'étudie le français."], ["Quelle est la nationalité d'une personne venant d'Allemagne ?", "Allemand / Allemande"], ["Calculez : $9 - 4 =$ _____", "cinq"], ["Comment dit-on 'street' et 'house' en français ?", "la rue et la maison"], ["Quelle est la réponse standard à 'Ça va ?' ?", "Ça va bien, merci."], ["Traduisez : 'The students listen to the professor'.", "Les étudiants écoutent le professeur."], ["Quel pays est situé entre l'Espagne et l'Allemagne ?", "La France"], ["Mettez au pluriel : 'Il est français'.", "Ils sont français."], ["Comment énonce-t-on le signe $\\times$ lors d'un calcul ?", "multiplié par"], ["Traduisez : 'I have one brother and two sisters'.", "J'ai un frère et deux sœurs."], ["Quel verbe régulier signifie 'to speak' ?", "parler"], ["Comment dit-on 'pen' et 'book' en français ?", "stylo et livre"]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
