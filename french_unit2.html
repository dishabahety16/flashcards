<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Unit 2 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>French &mdash; Unit 2</h1>
<p class="subtitle">78 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Comment dit-on le nombre 11 en français ?", "onze"], ["Comment dit-on le nombre 12 en français ?", "douze"], ["Comment dit-on le nombre 13 en français ?", "treize"], ["Comment dit-on le nombre 14 en français ?", "quatorze"], ["Comment dit-on le nombre 15 en français ?", "quinze"], ["Comment dit-on le nombre 16 en français ?", "seize"], ["Complétez la suite : dix-sept, dix-huit, _____.", "dix-neuf"], ["Comment écrit-on 21 en lettres ?", "vingt et un"], ["Comment écrit-on 31 en lettres ?", "trente et un"], ["Comment écrit-on 41 en lettres ?", "quarante et un"], ["Comment dit-on le nombre 50 en français ?", "cinquante"], ["Comment dit-on le nombre 60 en français ?", "soixante"], ["Conjuguez le verbe 'être' à la première personne du singulier (je).", "suis"], ["Conjuguez le verbe 'être' à la deuxième personne du singulier (tu).", "es"], ["Conjuguez le verbe 'être' à la troisième personne du singulier (il/elle/on).", "est"], ["Conjuguez le verbe 'être' à la première personne du pluriel (nous).", "sommes"], ["Conjuguez le verbe 'être' à la deuxième personne du pluriel (vous).", "êtes"], ["Conjuguez le verbe 'être' à la troisième personne du pluriel (ils/elles).", "sont"], ["Conjuguez le verbe 'avoir' à la première personne du singulier (j').", "ai"], ["Conjuguez le verbe 'avoir' à la deuxième personne du singulier (tu).", "as"], ["Conjuguez le verbe 'avoir' à la troisième personne du pluriel (ils/elles).", "ont"], ["Conjuguez le verbe 'aller' à la première personne du singulier (je).", "vais"], ["Conjuguez le verbe 'aller' à la deuxième personne du singulier (tu).", "vas"], ["Conjuguez le verbe 'aller' à la deuxième personne du pluriel (vous).", "allez"], ["Quel mot interrogatif utilise-t-on pour demander le nom d'une personne ?", "Comment"], ["Quel mot interrogatif utilise-t-on pour demander le lieu d'habitation ?", "Où"], ["Quel mot interrogatif utilise-t-on pour identifier une personne (C'est ____ ?) ?", "qui"], ["Quel mot interrogatif utilise-t-on pour demander la raison (_____ ?) ?", "Pourquoi"], ["Quelle est la réponse à 'Pourquoi ?'", "Parce que"], ["Répondez à la question négative : 'Tu n'es pas étudiant ?' (si vous êtes étudiant).", "Si, je suis étudiant."], ["Quand utilise-t-on le mot 'Si' au lieu de 'Oui' ?", "Pour répondre positivement à une question posée à la forme négative."], ["Adjectif possessif (je) : Masculin singulier.", "mon"], ["Adjectif possessif (je) : Féminin singulier.", "ma"], ["Adjectif possessif (je) : Pluriel.", "mes"], ["Adjectif possessif (tu) : Masculin singulier.", "ton"], ["Adjectif possessif (tu) : Féminin singulier.", "ta"], ["Adjectif possessif (tu) : Pluriel.", "tes"], ["Adjectif possessif (il/elle) : Masculin singulier.", "son"], ["Adjectif possessif (il/elle) : Féminin singulier.", "sa"], ["Adjectif possessif (il/elle) : Pluriel.", "ses"], ["Adjectif possessif (vous) : Singulier.", "votre"], ["Adjectif possessif (vous) : Pluriel.", "vos"], ["Adjectif possessif (ils/elles) : Singulier.", "leur"], ["Adjectif possessif (ils/elles) : Pluriel.", "leurs"], ["Pourquoi utilise-t-on 'mon' devant 'amie' (féminin) ?", "Parce que le nom commence par une voyelle."], ["Traduisez en français : 'I live in Nice.'", "J'habite à Nice."], ["Quelle est la capitale de l'Italie ?", "Rome"], ["Quelle est la capitale de l'Espagne ?", "Madrid"], ["Quelle est la capitale de l'Allemagne ?", "Berlin"], ["Dans quel pays se trouve la ville de Bruxelles ?", "La Belgique"], ["Féminin de l'adjectif de nationalité : 'français'.", "française"], ["Féminin de l'adjectif de nationalité : 'brésilien'.", "brésilienne"], ["Féminin de l'adjectif de nationalité : 'espagnol'.", "espagnole"], ["Féminin de l'adjectif de nationalité : 'allemand'.", "allemande"], ["Féminin de l'adjectif de nationalité : 'chinois'.", "chinoise"], ["Quel est le genre du pays 'Japon' ?", "Masculin (le Japon)"], ["Quel est le genre du pays 'France' ?", "Féminin (la France)"], ["Comment dit-on 'I am 20 years old' en français ?", "J'ai 20 ans."], ["Quel verbe utilise-t-on pour exprimer l'âge en français ?", "Le verbe avoir"], ["Comment dit-on 'Nice to meet you' en français ?", "Enchanté(e)"], ["Quelle est la forme plurielle de 'C'est' ?", "Ce sont"], ["Complétez : Tu _____ (habiter) à Paris ?", "habites"], ["Conjuguez 's'appeler' : Vous _____ comment ?", "vous appelez"], ["Conjuguez 's'appeler' : Je _____.", "m'appelle"], ["Quelle préposition utilise-t-on pour indiquer l'origine avec le verbe 'venir' (Je viens _____ Rio) ?", "de"], ["Quel est l'article défini pluriel pour les pays (_____ États-Unis) ?", "les"], ["Traduisez : 'Where are you from?' (familier)", "Tu es d'où ? (ou D'où viens-tu ?)"], ["Comment demande-t-on poliment le nom de quelqu'un ?", "Comment vous appelez-vous ?"], ["Identifiez la profession : Il travaille dans un journal.", "journaliste"], ["Identifiez la profession : Elle enseigne à l'école.", "professeur"], ["Identifiez la profession : Il crée des logiciels.", "informaticien"], ["Quel est le féminin de 'directeur' ?", "directrice"], ["Quel est le féminin de 'étudiant' ?", "étudiante"], ["Traduisez : 'My email address'.", "Mon adresse électronique."], ["Comment dit-on 'What is your phone number?' (familier)", "Quel est ton numéro de téléphone ?"], ["Complétez la question : '_____ est le professeur ?' (pour identifier la personne)", "Qui"], ["Vrai ou Faux : L'Espagne est en Asie.", "Faux (c'est en Europe)"], ["Conjuguez 'travailler' à la deuxième personne du pluriel (vous).", "travaillez"]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
