<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Unit 3 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>French &mdash; Unit 3</h1>
<p class="subtitle">75 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Quel mot utilise-t-on pour répondre positivement à une question affirmative ?", "Oui"], ["Quel mot utilise-t-on pour répondre négativement à une question affirmative ou négative ?", "Non"], ["Quel mot utilise-t-on pour répondre positivement à une question négative ?", "Si"], ["Complétez la réponse : « Tu n'es pas étudiant ? » — « _____, je suis étudiant. »", "Si"], ["Quelle préposition utilise-t-on devant un pays féminin (ex: France) ?", "En"], ["Quelle préposition utilise-t-on devant un pays masculin commençant par une consonne (ex: Portugal) ?", "Au"], ["Quelle préposition utilise-t-on devant un pays au pluriel (ex: Pays-Bas) ?", "Aux"], ["Quelle préposition utilise-t-on devant un pays masculin commençant par une voyelle (ex: Italie) ?", "En"], ["Quelle préposition utilise-t-on devant le nom d'une ville (ex: Rome) ?", "À"], ["Vrai ou Faux : Les noms de villes prennent généralement un article en français.", "Faux"], ["Dans un exercice de compréhension, que signifie « On ne sait pas » ?", "L'information n'est pas donnée dans le texte ou le dialogue."], ["Quelle structure utilise-t-on pour parler d'un sport avec le verbe « faire » ?", "Faire + article partitif (du, de la, de l', des) + sport"], ["Quel article partitif utilise-t-on pour un sport masculin singulier (ex: football) ?", "Du"], ["Quel article partitif utilise-t-on pour un sport féminin singulier (ex: natation) ?", "De la"], ["Quel article partitif utilise-t-on devant un sport commençant par une voyelle (ex: athlétisme) ?", "De l'"], ["Quel article partitif utilise-t-on pour les sports au pluriel (ex: arts martiaux) ?", "Des"], ["Quelle est la différence entre l'usage de « jouer » et « faire » pour les sports selon Alexa ?", "On utilise « jouer à » (ex: au football) et « faire de » (ex: du football)."], ["Citez quatre verbes utilisés pour exprimer ses goûts.", "Aimer, adorer, préférer, détester."], ["Quelle est la structure pour exprimer un goût avec un nom ?", "Sujet + verbe de goût + article défini (le, la, les) + nom."], ["Traduisez en français : « I prefer football to cricket. »", "Je préfère le football au cricket."], ["Comment forme-t-on la négation d'un verbe de goût (ex: aimer) ?", "On utilise « ne... pas » autour du verbe (ex: Je n'aime pas)."], ["Quelle est la première étape pour conjuguer un verbe régulier en -ER au présent ?", "On enlève la terminaison -ER de l'infinitif pour trouver le radical."], ["Quelle est la terminaison pour « je » dans les verbes en -ER ?", "-e"], ["Quelle est la terminaison pour « tu » dans les verbes en -ER ?", "-es"], ["Quelle est la terminaison pour « il / elle / on » dans les verbes en -ER ?", "-e"], ["Quelle est la terminaison pour « nous » dans les verbes en -ER ?", "-ons"], ["Quelle est la terminaison pour « vous » dans les verbes en -ER ?", "-ez"], ["Quelle est la terminaison pour « ils / elles » dans les verbes en -ER ?", "-ent"], ["Vrai ou Faux : La terminaison « -ent » des verbes au pluriel se prononce à l'oral.", "Faux"], ["Comment écrit-on le nombre $70$ en lettres ?", "Soixante-dix"], ["Comment écrit-on le nombre $71$ en lettres ?", "Soixante et onze"], ["Comment écrit-on le nombre $80$ en lettres ?", "Quatre-vingts"], ["Pourquoi y a-t-il un « s » à « quatre-vingts » mais pas à « quatre-vingt-un » ?", "« Vingt » prend un « s » uniquement s'il n'est pas suivi d'un autre chiffre."], ["Comment écrit-on le nombre $90$ en lettres ?", "Quatre-vingt-dix"], ["Comment écrit-on le nombre $99$ en lettres ?", "Quatre-vingt-dix-neuf"], ["Comment écrit-on le nombre $100$ en lettres ?", "Cent"], ["Vrai ou Faux : Le mot « mille » prend un « s » au pluriel.", "Faux"], ["Comment écrit-on le nombre $1,000,000$ en lettres ?", "Un million"], ["Comment lit-on généralement les numéros de téléphone en France ?", "On les lit chiffre par chiffre ou deux par deux."], ["Sur une fiche d'inscription, quelle est la différence entre « Nom » et « Prénom » ?", "Le « Nom » est le nom de famille et le « Prénom » est le nom personnel."], ["Quel est le format courant pour écrire une date de naissance en français ?", "Jour / Mois / Année"], ["Comment forme-t-on le Futur Proche ?", "Verbe « aller » au présent + verbe à l'infinitif."], ["Conjugaison du verbe « aller » au présent (toutes les personnes).", "Je vais, tu vas, il/elle/on va, nous allons, vous allez, ils/elles vont."], ["Quelle est la forme négative du Futur Proche (ex: je vais sortir) ?", "Ne + aller + pas + infinitif (ex: Je ne vais pas sortir)."], ["Donnez trois indicateurs de temps pour le futur.", "Demain, ce soir, la semaine prochaine (ou bientôt)."], ["Citez les trois cas d'utilisation du pronom « on » selon Pierre.", "On = nous, on indéfini (tout le monde), et pour parler aux enfants."], ["À quelle personne se conjugue toujours le verbe après le pronom « on » ?", "À la $3^e$ personne du singulier (comme il/elle)."], ["Quel est le pronom tonique correspondant à « on » quand il signifie « nous » ?", "Nous (ex: Nous, on va au cinéma)."], ["Vrai ou Faux : On peut faire l'accord de l'adjectif avec « on » s'il remplace « nous ».", "Vrai (ex: On est grandes)."], ["Quels sont les adjectifs possessifs pour « je » ?", "Mon, ma, mes"], ["Quels sont les adjectifs possessifs pour « tu » ?", "Ton, ta, tes"], ["Quels sont les adjectifs possessifs pour « il / elle / on » ?", "Son, sa, ses"], ["Quels sont les adjectifs possessifs pour « nous » ?", "Notre, nos"], ["Quels sont les adjectifs possessifs pour « vous » ?", "Votre, vos"], ["Quels sont les adjectifs possessifs pour « ils / elles » ?", "Leur, leurs"], ["Quand utilise-t-on « mon », « ton », « son » devant un nom féminin ?", "Quand le nom commence par une voyelle ou un « h » muet (ex: mon amie)."], ["Quelles sont les formes de l'adjectif démonstratif au singulier ?", "Ce (masc.), cette (fém.), cet (masc. devant voyelle/h muet)."], ["Quelle est la forme plurielle de l'adjectif démonstratif ?", "Ces"], ["Conjugaison du verbe « avoir » au présent (toutes les personnes).", "J'ai, tu as, il/elle/on a, nous avons, vous avez, ils/elles ont."], ["Quel verbe utilise-t-on en français pour exprimer l'âge ?", "Le verbe « avoir »."], ["Citez trois expressions de sensation utilisant le verbe « avoir ».", "Avoir faim, avoir soif, avoir chaud (ou froid/peur)."], ["Traduisez en français : « Mother » et « Father ».", "La mère et le père."], ["Traduisez en français : « Son » et « Daughter ».", "Le fils et la fille."], ["Traduisez en français : « Grandmother » et « Grandfather ».", "La grand-mère et le grand-père."], ["Comment dit-on « parents-in-law » ou « step-parents » en français ?", "Le beau-père et la belle-mère."], ["Traduisez en français : « Nephew » et « Niece ».", "Le neveu et la nièce."], ["Comment appelle-t-on les enfants de son oncle ou de sa tante ?", "Le cousin et la cousine."], ["Quelle est la différence entre un pronom de communication et un pronom de reprise ?", "Le pronom de communication désigne un interlocuteur (je, tu), tandis que le pronom de reprise remplace un antécédent."], ["Comment distingue-t-on un adjectif qualifiant d'un adjectif classifiant ?", "On peut ajouter « très » devant un adjectif qualifiant, mais pas devant un classifiant."], ["Vrai ou Faux : Le verbe peut varier en mode, en temps, en personne et en nombre.", "Vrai"], ["Quels sont les quatre éléments de base d'une lettre informelle ?", "Le lieu/date, la formule d'appel, le corps de la lettre, et la formule de politesse/signature."], ["Donnez un exemple de formule d'appel pour une lettre formelle.", "Madame, Monsieur,"], ["Que signifie l'expression « fonder une famille » ?", "Avoir des enfants et créer son propre foyer."], ["Traduisez en français : « Grandchildren ».", "Les petits-enfants."], ["Traduisez en français : « Brother-in-law » et « Sister-in-law ».", "Le beau-frère et la belle-sœur."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
