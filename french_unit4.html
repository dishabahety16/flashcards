<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Unit 4 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>French &mdash; Unit 4</h1>
<p class="subtitle">75 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Quel article défini utilise-t-on devant un nom masculin singulier commençant par une consonne ?", "Le"], ["Quel article remplace 'le' ou 'la' devant un nom commençant par une voyelle ou un 'h' muet ?", "L'"], ["Quel article défini désigne un groupe de noms au pluriel ?", "Les"], ["L'article utilisé pour introduire une chose inconnue ou mentionnée pour la première fois est l'article _____.", "indéfini"], ["Quels sont les trois articles indéfinis en français ?", "Un, une, des"], ["À la forme négative, les articles indéfinis 'un', 'une' et 'des' deviennent _____.", "de (ou d')"], ["Vrai ou Faux : L'article indéfini change après la négation avec le verbe 'être'.", "Faux (exemple : Ce n'est pas un professeur)."], ["En français, les noms abstraits comme 'la liberté' ou 'la musique' prennent obligatoirement l'article _____.", "défini"], ["Quelle est la traduction française de l'expression 'there is' ou 'there are' ?", "Il y a"], ["Vrai ou Faux : L'expression 'Il y a' change de forme au pluriel.", "Faux (elle est invariable)."], ["Quelle est la forme négative de l'expression 'Il y a' ?", "Il n'y a pas de"], ["Dans la phrase 'Il y a _____ deux jours', l'expression indique une durée passée.", "il y a"], ["Pour poser une question standard avec 'Il y a', on utilise la formule '_____ qu'il y a ?'.", "Est-ce"], ["Quelle est la règle générale pour former le pluriel des noms en français ?", "On ajoute un '-s' à la fin du nom."], ["Comment forment-on le pluriel des noms se terminant déjà par '-s', '-x' ou '-z' ?", "Ils restent invariables (ne changent pas)."], ["Quel est le pluriel des noms se terminant par '-eau' comme 'bateau' ?", "Bateaux (on ajoute un '-x')."], ["Quelles sont les deux exceptions des noms en '-eu' qui prennent un '-s' au lieu d'un '-x' ?", "Pneu et bleu"], ["La plupart des noms en '-al' comme 'journal' transforment leur pluriel en _____.", "-aux (journaux)"], ["Quelle est l'exception courante du pluriel en '-al' qui prend un '-s' ?", "Festival (festivals)"], ["Quel est le pluriel irrégulier du mot 'œil' ?", "Yeux"], ["Quel est le pluriel irrégulier du mot 'ciel' ?", "Cieux"], ["Transformez au pluriel : 'un bel animal' $\\rightarrow$ _____.", "de beaux animaux"], ["Quel pronom tonique utilise-t-on après une préposition pour remplacer 'je' ?", "Moi"], ["Quel pronom tonique utilise-t-on après une préposition pour remplacer 'tu' ?", "Toi"], ["Quel pronom tonique utilise-t-on après une préposition pour remplacer 'il' ?", "Lui"], ["Quel pronom tonique utilise-t-on après une préposition pour remplacer 'ils' ?", "Eux"], ["Correction : 'Je vais avec il' $\\rightarrow$ 'Je vais _____'.", "avec lui"], ["Correction : 'Elle habite chez je' $\\rightarrow$ 'Elle habite _____'.", "chez moi"], ["Le _____ est un temps utilisé pour parler d'une action terminée dans le passé.", "passé composé"], ["Quels sont les deux éléments nécessaires pour former le passé composé ?", "L'auxiliaire (avoir ou être) au présent et le participe passé."], ["Comment forme-t-on le participe passé des verbes réguliers en '-er' ?", "On remplace '-er' par '-é'."], ["Quel auxiliaire est utilisé pour la grande majorité des verbes au passé composé ?", "Avoir"], ["Vrai ou Faux : Le participe passé s'accorde avec le sujet quand on utilise l'auxiliaire 'avoir'.", "Faux"], ["Quel est le participe passé du verbe 'faire' ?", "Fait"], ["Quel est le participe passé du verbe 'prendre' ?", "Pris"], ["Quel est le participe passé du verbe 'voir' ?", "Vu"], ["Quel est le participe passé du verbe 'dire' ?", "Dit"], ["Quelles catégories de verbes utilisent l'auxiliaire 'être' au passé composé ?", "Les verbes de mouvement (DR & MRS VANDERTRAMP) et les verbes pronominaux."], ["Vrai ou Faux : Avec l'auxiliaire 'être', le participe passé s'accorde en genre et en nombre avec le sujet.", "Vrai"], ["Accordez le participe passé : 'Elle est _____ (partir) hier'.", "partie"], ["Accordez le participe passé : 'Elles sont _____ (arriver) tard'.", "arrivées"], ["Où place-t-on la négation 'pas' au passé composé ?", "Après l'auxiliaire (ex: Je n'ai pas mangé)."], ["Le pronom indéfini qui désigne une personne non identifiée est _____.", "quelqu'un"], ["Le pronom indéfini qui désigne une chose non identifiée est _____.", "quelque chose"], ["Quel est le pronom négatif correspondant à 'quelqu'un' ?", "Personne"], ["Quel est le pronom négatif correspondant à 'quelque chose' ?", "Rien"], ["Où se place 'rien' par rapport au participe passé ? (Ex: Je n'ai _____ mangé).", "Avant le participe passé."], ["Où se place 'personne' par rapport au participe passé ? (Ex: Je n'ai vu _____).", "Après le participe passé."], ["Quelle est la structure correcte pour ajouter un adjectif après 'quelqu'un' ?", "Quelqu'un + de + adjectif (ex: quelqu'un de gentil)."], ["Vrai ou Faux : L'adjectif après 'quelque chose de' est toujours au masculin singulier.", "Vrai"], ["Quel mot interrogatif utilise-t-on pour demander une information sur une personne ?", "Qui ?"], ["Quel mot interrogatif utilise-t-on pour demander une information sur une chose ?", "Qu'est-ce que ? (ou Quoi ?)"], ["Les verbes comme 'sembler', 'paraître' et 'devenir' sont appelés des verbes d'_____.", "état"], ["Le verbe 'devenir' exprime une _____ d'état.", "transformation (ou changement)"], ["Quels sont les trois verbes modaux suivis d'un infinitif courants au niveau A1-A2 ?", "Devoir, pouvoir, vouloir"], ["Comment appelle-t-on les animaux qui vivent avec les humains à la maison ?", "Les animaux de compagnie (ou domestiques)."], ["Quel est le féminin de 'le chien' ?", "La chienne"], ["Quel est le féminin de 'le chat' ?", "La chatte"], ["Quel animal de la ferme donne du lait ?", "La vache"], ["Quel animal de la ferme pond des œufs ?", "La poule"], ["Quel est le cri du coq en français ?", "Cocorico !"], ["Quel animal sauvage est connu pour être le 'roi de la jungle/savane' ?", "Le lion"], ["Quel verbe utilise-t-on pour dire qu'un singe monte aux arbres ?", "Grimper"], ["Vrai ou Faux : En France, les chiens sont souvent acceptés dans les restaurants.", "Vrai"], ["Que signifie l'expression 'avoir le cafard' ?", "Se sentir triste ou déprimé."], ["Que signifie l'expression 'donner sa langue au chat' ?", "Abandonner une devinette (ne plus chercher la réponse)."], ["Quel animal est considéré comme sacré dans la culture indienne (hindouisme) ?", "La vache"], ["Quel auteur français est célèbre pour ses fables mettant en scène des animaux ?", "Jean de La Fontaine"], ["Comment dit-on 'at my place' ou 'to my house' en français ?", "Chez moi"], ["Quel est l'article indéfini pluriel ?", "Des"], ["L'élision consiste à remplacer 'le' ou 'la' par 'l'' devant une _____.", "voyelle (ou h muet)"], ["Comment dit-on 'without them' (masculin) en utilisant un pronom tonique ?", "Sans eux"], ["Quel auxiliaire utilise le verbe 'aller' au passé composé ?", "Être (Je suis allé)."], ["Quel auxiliaire utilise le verbe 'manger' au passé composé ?", "Avoir (J'ai mangé)."], ["Quel mot de liaison chronologique signifie 'first' dans un récit ?", "D'abord"]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
