<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Unit 5 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>French &mdash; Unit 5</h1>
<p class="subtitle">77 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Que remplace un pronom complément d'objet direct (COD) ?", "Un nom de personne ou de chose qui suit directement le verbe sans préposition."], ["À quelles questions répond le complément d'objet direct (COD) ?", "Il répond aux questions « qui ? » ou « quoi ? » posées après le verbe."], ["Quel pronom COD remplace un nom masculin singulier ?", "Le (ou l' devant une voyelle)."], ["Quel pronom COD remplace un nom féminin singulier ?", "La (ou l' devant une voyelle)."], ["Quel pronom COD remplace tous les noms au pluriel (masculins et féminins) ?", "Les."], ["Où se place le pronom COD dans une phrase au présent ?", "Il se place juste avant le verbe conjugué."], ["Où se place le pronom COD avec le futur proche (aller + infinitif) ?", "Il se place juste avant le verbe à l'infinitif."], ["Dans une phrase négative, où se place le pronom COD ?", "Il se place entre « ne » et le verbe (ex: Je ne le connais pas)."], ["Cloze : Au passé composé avec l'auxiliaire avoir, le participe passé s'accorde en genre et en nombre avec le _____ s'il est placé avant le verbe.", "Pronom COD"], ["Quelle est la règle de l'élision pour les pronoms « le » et « la » ?", "Ils deviennent « l' » devant un mot commençant par une voyelle ou un h muet."], ["Traduisez : « Pourquoi ? »", "Why (utilisé pour demander la raison)."], ["Traduisez : « Parce que »", "Because (utilisé pour donner une explication)."], ["Quelle est la forme élidée de « parce que » devant une voyelle ?", "Parce qu'."], ["Quel est l'adjectif interrogatif masculin singulier pour dire « which » ou « what » ?", "Quel."], ["Quel est l'adjectif interrogatif féminin singulier ?", "Quelle."], ["Quel est l'adjectif interrogatif masculin pluriel ?", "Quels."], ["Quel est l'adjectif interrogatif féminin pluriel ?", "Quelles."], ["Comment demande-t-on l'heure en français ?", "Quelle heure est-il ?"], ["Quelle expression impersonnelle utilise-t-on pour donner l'heure ?", "Il est (ex: Il est huit heures)."], ["Comment dit-on « 12:00 (midday) » en français ?", "Il est midi."], ["Comment dit-on « 00:00 (midnight) » en français ?", "Il est minuit."], ["Comment exprime-t-on « quarter past » (ex: 9:15) ?", "Et quart (ex: Neuf heures et quart)."], ["Comment exprime-t-on « half past » (ex: 9:30) ?", "Et demie (ex: Neuf heures et demie)."], ["Comment exprime-t-on « quarter to » (ex: 8:45) ?", "Moins le quart (ex: Neuf heures moins le quart)."], ["Comment demande-t-on la date du jour ?", "Quelle est la date aujourd'hui ?"], ["Quelle est la structure pour dire la date ?", "Aujourd'hui, c'est le + nombre + mois (ex: C'est le 5 mars)."], ["Citez les mois du printemps en France (mars à mai).", "Mars, avril, mai."], ["Citez les mois de l'été en France (juin à août).", "Juin, juillet, août."], ["Citez les mois de l'automne en France (septembre à novembre).", "Septembre, octobre, novembre."], ["Citez les mois de l'hiver en France (décembre à février).", "Décembre, janvier, février."], ["Quel est le genre grammatical de tous les mois en français ?", "Masculin."], ["Quelle préposition utilise-t-on devant un mois pour situer un événement ?", "En (ex: Mon anniversaire est en juillet)."], ["Traduisez l'indicateur de temps : « maintenant »", "Now."], ["Traduisez l'indicateur de temps : « bientôt »", "Soon."], ["Traduisez l'adverbe : « souvent »", "Often."], ["Traduisez l'adverbe : « parfois »", "Sometimes."], ["Traduisez l'adverbe : « jamais »", "Never."], ["Traduisez l'expression : « tous les jours »", "Every day."], ["Traduisez l'expression : « le week-end »", "At the weekend / On weekends."], ["Que signifie l'expression « temps libre » ?", "Le temps disponible en dehors du travail ou de l'école."], ["Quelle est la journée traditionnelle de sortie au cinéma en France ?", "Le mercredi."], ["Combien de semaines de congés payés les travailleurs français ont-ils par an ?", "Cinq semaines."], ["Concept : « L'art de vivre français »", "Philosophie valorisant l'équilibre entre travail, gastronomie, culture et vie sociale."], ["Dans la négation « ne...pas », que deviennent les articles indéfinis (un, une, des) ?", "Ils deviennent « de » ou « d' »."], ["Quelle est l'exception à la règle du changement d'article dans la négation ?", "Avec le verbe « être », l'article ne change pas (ex: Ce n'est pas un livre)."], ["Que remplace la structure « ne...rien » ?", "Elle exprime l'absence de chose (nothing)."], ["Que remplace la structure « ne...personne » ?", "Elle exprime l'absence d'individu (no one)."], ["À quoi sert un article partitif (du, de la, de l', des) ?", "À désigner une quantité indéterminée d'une chose non comptable."], ["Quel article partitif utilise-t-on devant un nom masculin singulier (consonne) ?", "Du (ex: du pain)."], ["Quel article partitif utilise-t-on devant un nom féminin singulier (consonne) ?", "De la (ex: de la soupe)."], ["Quel article partitif utilise-t-on devant une voyelle ou un h muet ?", "De l' (ex: de l'eau)."], ["Quelle est la différence entre « J'aime le chocolat » et « Je mange du chocolat » ?", "Le premier exprime un goût général (défini) ; le second une quantité consommée (partitif)."], ["Que deviennent les articles partitifs après une négation « ne...pas » ?", "Ils deviennent tous « de » ou « d' »."], ["Comment demande-t-on une quantité ou un prix ?", "En utilisant « Combien ? » ou « Combien de + nom ? »."], ["Traduisez : « un peu de »", "A little / A bit of."], ["Traduisez : « beaucoup de »", "A lot of."], ["Quelle expression utilise-t-on pour une quantité excessive ?", "Trop de."], ["Quelle expression utilise-t-on pour une quantité suffisante ?", "Assez de."], ["Traduisez les couleurs : rouge, bleu, vert, jaune, noir, blanc.", "Red, blue, green, yellow, black, white."], ["Quelles sont les deux couleurs de base invariables (qui ne changent jamais) ?", "Marron et orange."], ["Où se place généralement l'adjectif de couleur par rapport au nom ?", "Après le nom (ex: une robe bleue)."], ["Quelle est la règle générale pour former le féminin d'un adjectif ?", "On ajoute un « -e » au masculin."], ["Comment forme-t-on le féminin des adjectifs se terminant par « -eux » (ex: heureux) ?", "Ils deviennent « -euse » (ex: heureuse)."], ["Comment forme-t-on le féminin des adjectifs se terminant par « -if » (ex: sportif) ?", "Ils deviennent « -ive » (ex: sportive)."], ["Comment forme-t-on le féminin des adjectifs se terminant par « -er » (ex: cher) ?", "Ils deviennent « -ère » (ex: chère)."], ["Quels sont les féminins des adjectifs irréguliers : beau, vieux, nouveau ?", "Belle, vieille, nouvelle."], ["Quel pronom complément indirect (COI) remplace « à + une personne singulière » ?", "Lui (masculin ou féminin)."], ["Quel pronom complément indirect (COI) remplace « à + plusieurs personnes » ?", "Leur."], ["Où se placent les pronoms COI (lui, leur) dans la phrase ?", "Avant le verbe (comme les pronoms COD)."], ["Traduisez : « offrir un cadeau »", "To give a gift."], ["Quelles sont les fleurs à éviter pour une occasion joyeuse en France ?", "Les chrysanthèmes (fleurs du deuil)."], ["Quels sont les cadeaux classiques en France ?", "Les fleurs, le vin, les chocolats et les livres."], ["Quelle est la règle pour offrir des fleurs en bouquet en France ?", "Il faut les offrir en nombre impair (sauf pour les roses par douzaine)."], ["Que doit-on faire immédiatement quand on reçoit un cadeau en France ?", "L'ouvrir devant la personne qui l'offre et la remercier."], ["Quelle préposition utilise-t-on pour dire « at someone's place » ?", "Chez (ex: chez moi, chez lui)."], ["Cloze : Le pronom réfléchi des verbes pronominaux à la 3e personne est _____.", "Se (ou s')"], ["Traduisez l'expression de fréquence : « parfois »", "Sometimes."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
