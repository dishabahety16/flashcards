<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General English Grammar — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a2332; --paper: #f6f3ee; --accent: #2d5a7b; --accent-light: #e8f0f6;
    --muted: #7a8694; --border: #d6cfc4; --card-bg: #ffffff; --flip-bg: #2d5a7b;
    --flip-text: #f0f6fa; --radius: 12px; --shadow: 0 2px 20px rgba(26,35,50,0.08);
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; background: var(--paper);
    color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem 1rem 2rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; max-width: 600px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem;
  }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.25rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-align: right;
  }
  .card-scene {
    width: 100%; max-width: 560px; height: 320px; perspective: 900px;
    margin-bottom: 1.25rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 2rem 2.25rem;
    text-align: center; box-shadow: var(--shadow); overflow-y: auto;
  }
  .card-front { background: var(--card-bg); border: 1px solid var(--border); }
  .card-back { background: var(--flip-bg); color: var(--flip-text); transform: rotateY(180deg); }
  .card-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.75rem; opacity: 0.5;
  }
  .card-front .card-label { color: var(--accent); }
  .card-back .card-label { color: var(--flip-text); }
  .card-text { font-size: 1.1rem; line-height: 1.55; }
  .tap-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); margin-top: auto; padding-top: 0.75rem; opacity: 0.6;
  }
  .card.flipped .card-front .tap-hint { visibility: hidden; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); padding: 0.55rem 1.1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { background: var(--card-bg); border-color: var(--border); }
  .btn-shuffle { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 0.78rem; }
  .btn-shuffle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .kbd-hints {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); opacity: 0.5;
  }
  .kbd-hints kbd {
    font-family: inherit; background: var(--card-bg); border: 1px solid var(--border);
    padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.65rem;
  }
  @media (max-width: 480px) {
    .card-scene { height: 290px; }
    .card-face { padding: 1.5rem 1.25rem; }
    .card-text { font-size: 1rem; }
    header h1 { font-size: 1.15rem; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Grammar</h1>
  <p>General English — 75 Flashcards</p>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="questionText"></div>
      <div class="tap-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answerText"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">&#8592; Prev</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn" id="nextBtn" onclick="next()">Next &#8594;</button>
</div>
<div class="kbd-hints">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &middot; <kbd>Space</kbd> flip
</div>
<script>
const DATA = [
["What part of speech denotes a person, place, thing, or abstract concept?", "Noun"],
["Which part of speech is used in place of a noun to avoid repetition and maintain coherence?", "Pronoun"],
["What part of speech expresses an action, occurrence, or state of being?", "Verb"],
["What part of speech modifies or describes a noun to provide information about quality or state?", "Adjective"],
["Which category of words modifies a verb, an adjective, or another adverb?", "Adverb"],
["What part of speech establishes a relationship (such as time or place) between a noun/pronoun and another element?", "Preposition"],
["Which part of speech is used to connect words, phrases, or clauses?", "Conjunction"],
["Which part of speech is used to express sudden emotion and is usually syntactically independent?", "Interjection"],
["Identify the part of speech for 'clearly' in the sentence: 'The professor spoke clearly during the lecture.'", "Adverb"],
["Concepts such as 'justice', 'love', and 'happiness' are examples of which specific type of noun?", "Abstract nouns"],
["In sentence pattern analysis, what does the symbol 'S' represent?", "Subject"],
["In sentence pattern analysis, what does the symbol 'C' represent?", "Complement"],
["In sentence pattern analysis, what does the symbol 'A' represent?", "Adverbial"],
["What is the basic sentence pattern for the phrase 'Birds fly'?", "S + V"],
["What is the sentence pattern for 'She reads a book'?", "S + V + O"],
["What is the sentence pattern for 'She is a teacher'?", "S + V + C"],
["Identify the sentence pattern for 'She gave me a pen'.", "S + V + IO + DO"],
["In the sentence 'She gave me a pen', which word functions as the Direct Object (DO)?", "a pen"],
["In the sentence 'She gave me a pen', which word functions as the Indirect Object (IO)?", "me"],
["What is the sentence pattern for 'They elected him leader'?", "S + V + O + C"],
["What is the sentence pattern for 'She placed the book on the table'?", "S + V + O + A"],
["The grammatical rule that a verb must match its subject in number and person is known as _____.", "Subject-Verb Agreement"],
["Which primary auxiliary verbs are used to form the continuous tenses and the passive voice?", "Forms of 'Be' (am, is, are, was, were)"],
["Which primary auxiliary verbs are used to form perfect tenses?", "Forms of 'Have' (have, has, had)"],
["Which primary auxiliary verbs are used for emphasis, negation, and question formation?", "Forms of 'Do' (do, does, did)"],
["In the present tense, third-person singular subjects generally require verbs ending in _____.", "-s or -es"],
["What verb form (singular or plural) is required when two singular subjects are joined by 'and'?", "Plural"],
["Subjects accompanied by determiners like 'each' or 'every' always take a _____ verb.", "singular"],
["When using 'neither... nor', the verb must agree with which part of the subject?", "The nearest subject"],
["Under what condition does a collective noun (like 'committee' or 'jury') take a plural verb?", "When members are acting as individuals or are divided in opinion."],
["What verb form is used for uncountable nouns such as 'furniture', 'news', or 'water'?", "Singular"],
["Explain the difference in verb agreement between 'The number of' and 'A number of'.", "The number of' takes a singular verb, while 'A number of' takes a plural verb."],
["Subject-Verb Agreement: Phrases representing sums of money, distances, or time (e.g., 'Five kilometres') usually take a _____ verb.", "singular"],
["Which pronoun case (subjective or objective) must follow a preposition, such as in the phrase 'between you and me'?", "Objective case"],
["What is the term for the noun that a pronoun refers back to?", "Antecedent"],
["Identify the type of pronoun used in: 'The student who won the prize is my friend.'", "Relative pronoun"],
["In the 'who vs whom' test, which pronoun form serves as the object and corresponds to the word 'him'?", "Whom"],
["The choice between the indefinite articles 'a' and 'an' is determined by the _____ of the following word.", "initial sound"],
["Why is 'an' the correct article to use before the word 'hour'?", "Because 'hour' begins with a vowel sound (the 'h' is silent)."],
["In terms of quantity, what is the difference between 'few' and 'a few'?", "Few' implies a negative shortage (almost none), whereas 'a few' implies a positive small number (some)."],
["Which quantifier is used for uncountable nouns to indicate a small but positive amount (some)?", "A little"],
["Correct the common grammatical error: 'We discussed about the project.'", "We discussed the project (omit 'about')."],
["What is the redundant word in the expression 'return back'?", "back"],
["Correct the double comparison error: 'She is more taller than her sister.'", "She is taller than her sister."],
["What is the standard rule for the verb form following a modal auxiliary (e.g., 'must', 'should')?", "It must be the base form of the verb without 'to'."],
["Why does the word 'Mathematics' take a singular verb despite ending in 's'?", "It is an uncountable noun representing a single subject or field of study."],
["Verbs like 'be', 'become', 'seem', and 'appear' are grammatically classified as _____ verbs.", "linking"],
["What type of verb does not require a direct object to complete its meaning (e.g., 'laugh', 'cry')?", "Intransitive verb"],
["Indefinite pronouns such as 'everyone', 'somebody', and 'nobody' are grammatically treated as _____.", "singular"],
["In the sentence 'She is a doctor', what is the specific grammatical function of 'a doctor'?", "Subject complement"],
["In the sentence 'The class found the lesson easy', what is the specific grammatical function of 'easy'?", "Object complement"],
["Under what structural condition is the word 'after' classified as a conjunction rather than a preposition?", "When it is followed by a complete clause (subject + verb)."],
["Which definite article is required before superlative adjectives like 'best' or 'tallest'?", "The"],
["Why do unique entities like 'the sun' or 'the Ganges' require the definite article?", "Because they refer to specific, one-of-a-kind items."],
["What is the difference between a possessive adjective (e.g., 'my') and a possessive pronoun (e.g., 'mine')?", "A possessive adjective precedes a noun, while a possessive pronoun stands alone."],
["What type of verb requires a direct object to function correctly (e.g., 'read', 'hit')?", "Transitive verb"],
["Adverbs typically answer questions regarding how, when, where, or to what _____.", "degree (or extent)"],
["Which type of pronoun is used when the subject and the object of the verb are the same person or thing?", "Reflexive pronoun"],
["Where are determiners typically placed in relation to adjectives within a noun phrase?", "Before the adjective."],
["Proper names of people and most individual countries generally take the _____ article.", "zero (or no)"],
["Correct the Subject-Verb Agreement error: 'One of my friends are coming.'", "One of my friends is coming."],
["Correct the error: 'I requested for a leave.'", "I requested a leave (omit 'for')."],
["Identify the correct verb form: 'Neither the teacher nor the students ______ (is/are) ready.'", "are"],
["Sentence Pattern: Identify the pattern of 'The teacher gave the students homework.'", "S + V + IO + DO"],
["Which modal auxiliary is used specifically to express present ability?", "can"],
["Which modal auxiliary is used to express a recommendation or moral advice?", "should"],
["Identify the correct verb: 'The news ______ (is/are) very encouraging.'", "is"],
["Sentence Pattern: Identify the pattern of 'She placed the book on the table.'", "S + V + O + A"],
["Correct the redundancy error in the phrase: 'repeat the statement again'.", "repeat the statement (omit 'again')."],
["Which primary auxiliary is used to form the perfect tenses (e.g., 'She ______ finished')?", "has (or have/had)"],
["What verb form follows the phrase 'A number of'?", "Plural"],
["In the sentence 'The sky grew dark', what is the grammatical role of 'dark'?", "Subject complement"],
["Which part of speech is 'however' in the sentence 'The students, however, expressed concerns'?", "Conjunctive adverb"],
["Sentence Pattern: Identify the pattern for 'The crowd cheered loudly.'", "S + V + A"],
["Subject-Verb Agreement: In 'The list of items (is/are) on the table', which word is the head noun that determines the verb?", "list"]
];
let order = [...Array(DATA.length).keys()];
let idx = 0;
const card = document.getElementById('card');
const qText = document.getElementById('questionText');
const aText = document.getElementById('answerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
function render() {
  const i = order[idx];
  qText.textContent = DATA[i][0];
  aText.textContent = DATA[i][1];
  card.classList.remove('flipped');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === order.length - 1;
  const pct = ((idx + 1) / order.length * 100).toFixed(0);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = (idx + 1) + ' / ' + order.length;
}
function flip() { card.classList.toggle('flipped'); }
function next() { if (idx < order.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; render();
}
document.getElementById('cardScene').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
