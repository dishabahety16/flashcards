<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wedding — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a2332; --paper: #f6f3ee; --accent: #2d5a7b; --accent-light: #e8f0f6;
    --muted: #7a8694; --border: #d6cfc4; --card-bg: #ffffff; --flip-bg: #2d5a7b;
    --flip-text: #f0f6fa; --radius: 12px; --shadow: 0 2px 20px rgba(26,35,50,0.08);
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; background: var(--paper);
    color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem 1rem 2rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; max-width: 600px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem;
  }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.25rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-align: right;
  }
  .card-scene {
    width: 100%; max-width: 560px; height: 320px; perspective: 900px;
    margin-bottom: 1.25rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 2rem 2.25rem;
    text-align: center; box-shadow: var(--shadow); overflow-y: auto;
  }
  .card-front { background: var(--card-bg); border: 1px solid var(--border); }
  .card-back { background: var(--flip-bg); color: var(--flip-text); transform: rotateY(180deg); }
  .card-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.75rem; opacity: 0.5;
  }
  .card-front .card-label { color: var(--accent); }
  .card-back .card-label { color: var(--flip-text); }
  .card-text { font-size: 1.1rem; line-height: 1.55; }
  .tap-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); margin-top: auto; padding-top: 0.75rem; opacity: 0.6;
  }
  .card.flipped .card-front .tap-hint { visibility: hidden; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); padding: 0.55rem 1.1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { background: var(--card-bg); border-color: var(--border); }
  .btn-shuffle { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 0.78rem; }
  .btn-shuffle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .kbd-hints {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); opacity: 0.5;
  }
  .kbd-hints kbd {
    font-family: inherit; background: var(--card-bg); border: 1px solid var(--border);
    padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.65rem;
  }
  @media (max-width: 480px) {
    .card-scene { height: 290px; }
    .card-face { padding: 1.5rem 1.25rem; }
    .card-text { font-size: 1rem; }
    header h1 { font-size: 1.15rem; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>The Wedding</h1>
  <p>Anton Chekhov — 50 Flashcards</p>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="questionText"></div>
      <div class="tap-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answerText"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">&#8592; Prev</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn" id="nextBtn" onclick="next()">Next &#8594;</button>
</div>
<div class="kbd-hints">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &middot; <kbd>Space</kbd> flip
</div>
<script>
const DATA = [
["Who is the author of the one-act play 'The Wedding'?", "Anton Chekhov."],
["In what year was Chekhov's 'The Wedding' first performed?", "1889.0"],
["What was Anton Chekhov's professional qualification besides being a writer?", "He was a trained doctor (physician)."],
["Chekhov's medical background led him to observe human nature with _____ precision, recording symptoms of social illness without moralising.", "clinical"],
["Term: One-act play", "Definition: A play that consists of a single continuous scene with no intervals, characterised by compressed action."],
["Where is the setting for the entire duration of 'The Wedding'?", "A room in Andronov's Restaurant."],
["What is the social rank and occupation of the bride's father, Evdokim Zaharovitch Zhigalov?", "He is a retired Civil Servant."],
["Which character is the bride and daughter of Zhigalov?", "Dashenka."],
["What specific item of 'domestic importance' does Aplombov accuse his mother-in-law of pawning?", "Two lottery tickets."],
["How does Aplombov describe his own personality to Nastasya Timofeyevna?", "He claims to be a serious man of character who does not enjoy empty pleasures."],
["Who is the insurance agent responsible for bringing a 'General' to the wedding supper?", "Andrey Andreyevitch Nunin."],
["What is the profession and age of Anna Martinovna Zmeyukina?", "She is a midwife, aged 30."],
["Which guest is a telegraphist who is in love with Zmeyukina?", "Ivan Mihailovitch Yats."],
["What is the nationality and trade of Harlampi Spiridonovitch Dimba?", "He is a Greek confectioner."],
["Dmitri Stepanovitch Mozgovoy is a sailor serving in the _____.", "Imperial Navy (Volunteer Fleet)"],
["Why is Aplombov annoyed that Yats was invited to the wedding?", "Yats was a suitor for Dashenka before Aplombov proposed."],
["Zmeyukina frequently complains of feeling _____ and demands 'poetry' or 'atmosphere'.", "suffocated"],
["What is Dimba's repetitive response to Zhigalov's questions about Greece?", "\"Yes, everysing is zere.\""],
["What does Zhigalov believe is the true nature of electric lighting?", "He considers it a swindle or a fraud on the public."],
["According to Nastasya Timofeyevna, what does Dashenka's dowry include besides a thousand roubles?", "Three dresses, a bed, and all the furniture."],
["Why does Aplombov tell Yats to 'get out' of the restaurant?", "He believes Yats is hinting that he is only marrying for profit."],
["What does Yats demand from Aplombov before he agrees to leave the party?", "Five roubles borrowed on the strength of a piqu\u00e9 waistcoat."],
["How does Nunin describe the 'General' he has supposedly found?", "As a 'real', 'solid' man who is eighty or ninety years old."],
["What is the actual naval rank of Fyodor Yakovlevitch Revunov-Karaulov?", "Second-class naval captain."],
["In the Russian table of precedence, a second-class naval captain is the equivalent of which army rank?", "Lieutenant-colonel."],
["Why does Nunin ask Revunov-Karaulov to allow himself to be called 'Your Excellency'?", "The host family is patriarchal and highly respects rank."],
["What specific physical ailment makes Revunov-Karaulov unaware that he is boring the other guests?", "He is hard of hearing (deafness)."],
["How does Yats attempt to pay tribute to Revunov-Karaulov using his professional skills?", "By tapping out Morse code messages with a fork on the table."],
["What topic dominates Revunov-Karaulov's long, technical monologues at the dinner table?", "Naval commands and nautical manoeuvres."],
["Nastasya Timofeyevna explodes in anger at Revunov-Karaulov because his manners are 'awful' and he is _____ the guests.", "boring"],
["How much money was Nunin given by the Zhigalovs to hire a general?", "25 roubles."],
["How does Revunov-Karaulov react when he realises he was 'hired' to attend the wedding?", "He is deeply insulted, calls the situation 'mean and low', and leaves."],
["What is the final stage image before the curtain falls?", "Total uproar with Zmeyukina suffocating and Yats in a transport of delight."],
["Term: Dramatic Irony", "Definition: A situation where the audience knows a key fact (e.g., the General is a fraud) that the characters do not."],
["In 'The Wedding', _____ is created by placing technical naval commands in the middle of a wedding celebration.", "incongruity"],
["What does the name 'Aplombov' suggest about the character's personality?", "Pompous self-assurance or arrogance."],
["What does the name 'Zmeyukina' (derived from the word for snake) suggest about the character?", "A theatrical, venomous, or 'coiling' nature."],
["The character name 'Revunov' is derived from a word meaning one who _____, reflecting his loud nautical commands.", "bawls or shouts"],
["What central theme is explored through the Zhigalovs' desire to have a high-ranking official at the wedding?", "Social climbing (or social pretension)."],
["How does Chekhov illustrate class consciousness when Revunov's true rank is revealed?", "The family's respect instantly vanishes and turns into financial hostility."],
["Why is the 25-rouble payment a significant satirical detail?", "It reduces social prestige to a cheap, purchasable commodity."],
["Concept: Indirection in Satire", "Chekhov's method of showing social failure without explicitly stating a moral or judging characters."],
["How does Dashenka's silence serve Chekhov's satirical purpose?", "It shows that the person at the centre of the event is erased by the guests' social performances."],
["In the play, the _____ functions as a stage where human vanity and the performance of status are exposed.", "wedding celebration"],
["What is the effect of the 'abrupt curtain' ending in 'The Wedding'?", "It suggests that social pretension does not resolve or redeem, but simply collapses into chaos."],
["Why is the restaurant setting more effective for satire than a private home?", "It ensures that the family's social failure is a public performance witnessed by others."],
["Term: Bathos", "Definition: A sudden shift from a grand or important tone to a trivial or ridiculous one for comic effect."],
["What does Nastasya Timofeyevna's immediate demand for the 25 roubles back reveal about her character?", "She values the financial transaction of rank more than the dignity of the person."],
["Which character represents the 'enabler' who facilitates the deception for his own social ease?", "Andrey Andreyevitch Nunin."],
["According to the analysis, Chekhov's satire is 'Chekhovian' because it trusts the _____ of the audience to understand the joke without explanation.", "intelligence"]
];
let order = [...Array(DATA.length).keys()];
let idx = 0;
const card = document.getElementById('card');
const qText = document.getElementById('questionText');
const aText = document.getElementById('answerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
function render() {
  const i = order[idx];
  qText.textContent = DATA[i][0];
  aText.textContent = DATA[i][1];
  card.classList.remove('flipped');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === order.length - 1;
  const pct = ((idx + 1) / order.length * 100).toFixed(0);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = (idx + 1) + ' / ' + order.length;
}
function flip() { card.classList.toggle('flipped'); }
function next() { if (idx < order.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; render();
}
document.getElementById('cardScene').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
