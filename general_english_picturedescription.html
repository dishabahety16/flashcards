<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Description — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a2332; --paper: #f6f3ee; --accent: #2d5a7b; --accent-light: #e8f0f6;
    --muted: #7a8694; --border: #d6cfc4; --card-bg: #ffffff; --flip-bg: #2d5a7b;
    --flip-text: #f0f6fa; --radius: 12px; --shadow: 0 2px 20px rgba(26,35,50,0.08);
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; background: var(--paper);
    color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem 1rem 2rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; max-width: 600px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem;
  }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.25rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-align: right;
  }
  .card-scene {
    width: 100%; max-width: 560px; height: 320px; perspective: 900px;
    margin-bottom: 1.25rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 2rem 2.25rem;
    text-align: center; box-shadow: var(--shadow); overflow-y: auto;
  }
  .card-front { background: var(--card-bg); border: 1px solid var(--border); }
  .card-back { background: var(--flip-bg); color: var(--flip-text); transform: rotateY(180deg); }
  .card-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.75rem; opacity: 0.5;
  }
  .card-front .card-label { color: var(--accent); }
  .card-back .card-label { color: var(--flip-text); }
  .card-text { font-size: 1.1rem; line-height: 1.55; }
  .tap-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); margin-top: auto; padding-top: 0.75rem; opacity: 0.6;
  }
  .card.flipped .card-front .tap-hint { visibility: hidden; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); padding: 0.55rem 1.1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { background: var(--card-bg); border-color: var(--border); }
  .btn-shuffle { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 0.78rem; }
  .btn-shuffle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .kbd-hints {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); opacity: 0.5;
  }
  .kbd-hints kbd {
    font-family: inherit; background: var(--card-bg); border: 1px solid var(--border);
    padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.65rem;
  }
  @media (max-width: 480px) {
    .card-scene { height: 290px; }
    .card-face { padding: 1.5rem 1.25rem; }
    .card-text { font-size: 1rem; }
    header h1 { font-size: 1.15rem; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Picture Description</h1>
  <p>General English — 29 Flashcards</p>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="questionText"></div>
      <div class="tap-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answerText"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">&#8592; Prev</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn" id="nextBtn" onclick="next()">Next &#8594;</button>
</div>
<div class="kbd-hints">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &middot; <kbd>Space</kbd> flip
</div>
<script>
const DATA = [
["What is the primary definition of 'Picture Description' in a communicative English context?", "A speaking activity where students observe a picture carefully and describe it in clear, meaningful sentences."],
["Which five specific skills does Picture Description help a student develop?", "Observation, vocabulary, imagination, fluency, and speaking confidence."],
["According to the unit hook, how many skills are tested simultaneously during a Picture Description task?", "Six skills (observation, vocabulary, grammar, sentence structure, pronunciation, and confidence)."],
["How long should students typically observe an image before starting a Picture Description activity?", "One to two minutes."],
["In the teacher's guiding questions, which question targets the setting of the image?", "Where is the scene set?"],
["In the teacher's guiding questions, which question aims at the interpretive meaning of the image?", "What is the overall message?"],
["In the S\u00b7A\u00b7D\u00b7M framework, what does the letter 'S' represent?", "Scene (setting and context)."],
["In the S\u00b7A\u00b7D\u00b7M framework, what does the letter 'A' represent?", "Action (what people are doing)."],
["In the S\u00b7A\u00b7D\u00b7M framework, what does the letter 'D' represent?", "Details (specific colors, objects, and expressions)."],
["In the S\u00b7A\u00b7D\u00b7M framework, what does the letter 'M' represent?", "Message (the overall theme or interpretation)."],
["What is the purpose of using the S\u00b7A\u00b7D\u00b7M sequence instead of a random order?", "It mirrors how the eye naturally processes an image from broad context to specific details and interpretation."],
["Which spatial expression refers to the part of the picture closest to the viewer?", "In the foreground."],
["Which spatial expression refers to the part of the picture farthest from the viewer?", "In the background."],
["Why is 'The picture conveys a calm atmosphere' considered a stronger description than 'The place is nice'?", "It uses an interpretive verb and specific adjectives rather than a vague personal opinion."],
["A strong description of a person should include a position word, a specific action, and a _____.", "Detail."],
["What is the mnemonic rhyme used to remember the four guiding questions for any picture?", "Scene first, then Action, add Details with care\u2014end with the Message the picture puts there."],
["Which mnemonic helps students remember the five skills developed by Picture Description?", "O-V-I-F-C (Observation, Vocabulary, Imagination, Fluency, Confidence)."],
["What is the recommended word length for a standard student Bio-Note?", "50 to 80 words."],
["What is the primary difference in 'person' between a formal and an informal Bio-Note?", "Formal uses the third person (He/She), while informal uses the first person (I)."],
["Define a 'Bio-Note' in one sentence.", "A short paragraph summarizing a person's identity, qualifications, achievements, and interests."],
["In the I\u00b7Q\u00b7A\u00b7I\u00b7G framework, what does the letter 'I' (first) stand for?", "Identity (full name and current role)."],
["In the I\u00b7Q\u00b7A\u00b7I\u00b7G framework, what does the letter 'Q' stand for?", "Qualification (course, degree, or institution)."],
["In the I\u00b7Q\u00b7A\u00b7I\u00b7G framework, what does the letter 'A' stand for?", "Achievement (key strengths, skills, or awards)."],
["In the I\u00b7Q\u00b7A\u00b7I\u00b7G framework, what does the second 'I' stand for?", "Interest (hobbies, passions, or areas of focus)."],
["In the I\u00b7Q\u00b7A\u00b7I\u00b7G framework, what does the letter 'G' stand for?", "Goal (ambition or future plans)."],
["Which document is described as a structured, multi-section record used for job applications?", "Curriculum Vitae (CV)."],
["What does a 'Weak' description like 'It is a park' lack compared to a 'Strong' one?", "Specific adjectives, time context, and a formal opening expression."],
["What is the role of the teacher during the Picture Description speaking phase?", "To help students with vocabulary and correct their sentence structures."],
["Why is 'The picture reflects the importance of education' a high-level closing sentence?", "It identifies the symbolic or social significance of the scene rather than just describing objects."]
];
let order = [...Array(DATA.length).keys()];
let idx = 0;
const card = document.getElementById('card');
const qText = document.getElementById('questionText');
const aText = document.getElementById('answerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
function render() {
  const i = order[idx];
  qText.textContent = DATA[i][0];
  aText.textContent = DATA[i][1];
  card.classList.remove('flipped');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === order.length - 1;
  const pct = ((idx + 1) / order.length * 100).toFixed(0);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = (idx + 1) + ' / ' + order.length;
}
function flip() { card.classList.toggle('flipped'); }
function next() { if (idx < order.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; render();
}
document.getElementById('cardScene').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
