<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still I Rise — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a2332; --paper: #f6f3ee; --accent: #2d5a7b; --accent-light: #e8f0f6;
    --muted: #7a8694; --border: #d6cfc4; --card-bg: #ffffff; --flip-bg: #2d5a7b;
    --flip-text: #f0f6fa; --radius: 12px; --shadow: 0 2px 20px rgba(26,35,50,0.08);
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; background: var(--paper);
    color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem 1rem 2rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; max-width: 600px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem;
  }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.25rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-align: right;
  }
  .card-scene {
    width: 100%; max-width: 560px; height: 320px; perspective: 900px;
    margin-bottom: 1.25rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 2rem 2.25rem;
    text-align: center; box-shadow: var(--shadow); overflow-y: auto;
  }
  .card-front { background: var(--card-bg); border: 1px solid var(--border); }
  .card-back { background: var(--flip-bg); color: var(--flip-text); transform: rotateY(180deg); }
  .card-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.75rem; opacity: 0.5;
  }
  .card-front .card-label { color: var(--accent); }
  .card-back .card-label { color: var(--flip-text); }
  .card-text { font-size: 1.1rem; line-height: 1.55; }
  .tap-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); margin-top: auto; padding-top: 0.75rem; opacity: 0.6;
  }
  .card.flipped .card-front .tap-hint { visibility: hidden; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); padding: 0.55rem 1.1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { background: var(--card-bg); border-color: var(--border); }
  .btn-shuffle { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 0.78rem; }
  .btn-shuffle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .kbd-hints {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); opacity: 0.5;
  }
  .kbd-hints kbd {
    font-family: inherit; background: var(--card-bg); border: 1px solid var(--border);
    padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.65rem;
  }
  @media (max-width: 480px) {
    .card-scene { height: 290px; }
    .card-face { padding: 1.5rem 1.25rem; }
    .card-text { font-size: 1rem; }
    header h1 { font-size: 1.15rem; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Still I Rise</h1>
  <p>Maya Angelou — 50 Flashcards</p>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="questionText"></div>
      <div class="tap-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answerText"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">&#8592; Prev</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn" id="nextBtn" onclick="next()">Next &#8594;</button>
</div>
<div class="kbd-hints">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &middot; <kbd>Space</kbd> flip
</div>
<script>
const DATA = [
["Who is the author of the poem 'Still I Rise'?", "Maya Angelou"],
["In the first stanza of 'Still I Rise', what does the speaker compare herself to when being trodden into the dirt?", "Dust"],
["What metaphor does Angelou use in stanza 2 to describe her self-assurance and inner wealth?", "Oil wells pumping in her living room"],
["In stanza 5, which element does the speaker compare her rise to after being attacked by hatefulness?", "Air"],
["According to the final stanza of 'Still I Rise', what does the speaker bring with her as she rises?", "The gifts her ancestors gave"],
["In 'Still I Rise', what do the 'moons', 'suns', and 'tides' symbolize in relation to the speaker's resilience?", "The natural certainty and inevitability of her rising"],
["What is the significance of the 'bitter, twisted lies' mentioned in the opening stanza of 'Still I Rise'?", "They represent false historical narratives used by oppressors to demean her"],
["What does the term 'sassiness' represent within the context of Angelou's poem?", "A fearless and proud attitude that challenges expected submission"],
["In the final stanza of 'Still I Rise', what does the 'daybreak' represent?", "Hope, freedom, and a clear new beginning away from the past"],
["How does the speaker characterize her relationship to the history of slavery in the final stanza?", "She is the realization of the dream and hope held by enslaved ancestors"],
["How does the speaker demonstrate defiance against verbal and visual attacks in stanza 5?", "She maintains an invincible spirit that rises effortlessly like air"],
["How is the concept of 'inner richness' applied to the speaker's walk in 'Still I Rise'?", "She walks with the confidence of someone possessing vast, hidden resources"],
["In what way does the speaker apply the metaphor of 'dust' to reclaim her social standing?", "She shows that even when pushed to the bottom, her rise is a natural law"],
["How does the speaker apply her 'ancestral legacy' to her current struggle for empowerment?", "She uses the strength and gifts of those before her to fuel her triumph"],
["How does the speaker use body language to reject the oppressor's desire to see her broken?", "She refuses to bow her head or lower her eyes, maintaining a posture of pride"],
["Contrast the imagery of 'nights of terror' with the 'daybreak' in the final stanza of 'Still I Rise'.", "It contrasts the dark history of racial suffering with a bright future of liberation"],
["Analyze how the repetition of the phrase 'I rise' contributes to the poem's overall tone.", "It builds an unstoppable rhythm that reinforces the theme of celebratory resilience"],
["What does the speaker's question about the oppressor being 'beset with gloom' reveal about their dynamic?", "It highlights the oppressor's discomfort and failure when faced with her joy"],
["Analyze the purpose of comparing hope to something 'springing high' in stanza 3.", "It emphasizes that hope is a persistent and renewing natural force"],
["Analyze the imagery of 'shoulders falling down like teardrops' in the context of oppression.", "It symbolizes the physical manifestation of defeat and sorrow the oppressor expects"],
["Evaluate the effectiveness of using 'air' as a metaphor for resilience compared to 'dust'.", "Air suggests a spiritual invincibility and lightness that cannot be grasped or held"],
["Justify the speaker\u2019s claim that she is the 'dream and the hope of the slave'.", "Her success and resilience validate the struggles of ancestors who fought for freedom"],
["Evaluate the use of natural cycles (tides, suns) to argue against social discrimination.", "It frames her equality and rise as an undeniable, universal law of nature"],
["Critique the role of 'sassiness' and 'haughtiness' as tools of social resistance in the poem.", "They serve as psychological armor that denies the oppressor the satisfaction of her pain"],
["Evaluate the progression from 'dirt' in the first stanza to 'leaping upon clouds' (in spirit) by the end.", "It illustrates a total transformation from being grounded by lies to spiritual liberation"],
["Who is the author of the poem 'The Chimney Sweeper'?", "William Blake"],
["What historical context informs the harsh conditions described in 'The Chimney Sweeper'?", "The Industrial Revolution and child labor in England"],
["In Blake's poem, why does the speaker say he sleeps in soot?", "His mother died and his father sold him into chimney sweeping at a young age"],
["What does the narrator tell Tom Dacre to comfort him when his head is shaved?", "That the soot cannot spoil his white hair if his head is bare"],
["In Tom Dacre's dream, what do the 'coffins of black' represent?", "The dark chimneys and the miserable, trapped lives of the children"],
["Who appears in Tom Dacre's dream to set the chimney sweepers free?", "An Angel with a bright key"],
["What imagery in 'The Chimney Sweeper' dream sequence symbolizes joy and purity?", "Children running on a green plain and washing in a river"],
["What promise does the Angel make to Tom Dacre in the dream?", "If he is a good boy, God will be his father and he will never lack joy"],
["How does the final line of 'The Chimney Sweeper' reflect the children's perspective on their hardship?", "They believe that if everyone does their duty, they need not fear harm"],
["The phrase ' 'weep! 'weep! 'weep! 'weep!' in Blake's poem is the child's attempt to cry out the word _____.", "Sweep"],
["Who is the author of the poem 'Ecology'?", "A. K. Ramanujan"],
["What yearly event causes the poet in 'Ecology' to return home in a 'rage'?", "The first rain of the season"],
["Why does the mother in Ramanujan's poem suffer from 'blinding migraines'?", "The heavy fragrance and pollen from the blooming Red Champak trees"],
["How does the poem 'Ecology' describe the yellow pollen fragrance in the air?", "As a street-long, heavy-hung yellow pollen fog"],
["Why does the mother refuse to let her children cut down the Champak tree?", "She has an emotional and cultural connection to the tree which provides flowers for gods"],
["According to the mother in 'Ecology', how was the Champak tree originally seeded?", "By a passing bird's 'providential droppings'"],
["What sensory details are used to describe the old house in 'Ecology'?", "Walls with 'ears and eyes' that are porous to smells and sounds"],
["What does the phrase 'dower of migraines' suggest at the end of Ramanujan's poem?", "The seasonal pain is an inherited family legacy alongside the tree's beauty"],
["To what does the poet compare the Mother\u2019s temper in 'Ecology'?", "Her mother\u2019s twisted silver"],
["What is the central theme concerning the relationship between humans and nature in 'Ecology'?", "Human beings and nature are interconnected and cannot be easily separated"],
["What do the chimney sweepers leave behind in Tom's dream as they rise upon clouds?", "Their bags"],
["In 'The Chimney Sweeper', whose hair is described as 'curled like a lamb's back'?", "Tom Dacre"],
["In 'Ecology', what physical item does the mother use to try and relieve her migraine?", "A cold pack on her head"],
["In Blake's poem, what time of day do the boys rise to go to work with their bags and brushes?", "In the dark"],
["What is the overall message of the poem 'Ecology' regarding environmental responsibility?", "It encourages awareness of sustainable living and the value of nature despite discomfort"]
];
let order = [...Array(DATA.length).keys()];
let idx = 0;
const card = document.getElementById('card');
const qText = document.getElementById('questionText');
const aText = document.getElementById('answerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
function render() {
  const i = order[idx];
  qText.textContent = DATA[i][0];
  aText.textContent = DATA[i][1];
  card.classList.remove('flipped');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === order.length - 1;
  const pct = ((idx + 1) / order.length * 100).toFixed(0);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = (idx + 1) + ' / ' + order.length;
}
function flip() { card.classList.toggle('flipped'); }
function next() { if (idx < order.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; render();
}
document.getElementById('cardScene').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
