<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Last Leaf — Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a2332; --paper: #f6f3ee; --accent: #2d5a7b; --accent-light: #e8f0f6;
    --muted: #7a8694; --border: #d6cfc4; --card-bg: #ffffff; --flip-bg: #2d5a7b;
    --flip-text: #f0f6fa; --radius: 12px; --shadow: 0 2px 20px rgba(26,35,50,0.08);
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif; background: var(--paper);
    color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 1.5rem 1rem 2rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; max-width: 600px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem;
  }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 1.25rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-align: right;
  }
  .card-scene {
    width: 100%; max-width: 560px; height: 320px; perspective: 900px;
    margin-bottom: 1.25rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 2rem 2.25rem;
    text-align: center; box-shadow: var(--shadow); overflow-y: auto;
  }
  .card-front { background: var(--card-bg); border: 1px solid var(--border); }
  .card-back { background: var(--flip-bg); color: var(--flip-text); transform: rotateY(180deg); }
  .card-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.75rem; opacity: 0.5;
  }
  .card-front .card-label { color: var(--accent); }
  .card-back .card-label { color: var(--flip-text); }
  .card-text { font-size: 1.1rem; line-height: 1.55; }
  .tap-hint {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); margin-top: auto; padding-top: 0.75rem; opacity: 0.6;
  }
  .card.flipped .card-front .tap-hint { visibility: hidden; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); padding: 0.55rem 1.1rem;
    border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { background: var(--card-bg); border-color: var(--border); }
  .btn-shuffle { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 0.78rem; }
  .btn-shuffle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .kbd-hints {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.7rem; color: var(--muted); opacity: 0.5;
  }
  .kbd-hints kbd {
    font-family: inherit; background: var(--card-bg); border: 1px solid var(--border);
    padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.65rem;
  }
  @media (max-width: 480px) {
    .card-scene { height: 290px; }
    .card-face { padding: 1.5rem 1.25rem; }
    .card-text { font-size: 1rem; }
    header h1 { font-size: 1.15rem; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>The Last Leaf</h1>
  <p>O. Henry — 64 Flashcards</p>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-label">Question</div>
      <div class="card-text" id="questionText"></div>
      <div class="tap-hint">Tap to reveal answer</div>
    </div>
    <div class="card-face card-back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="answerText"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">&#8592; Prev</button>
  <button class="btn btn-shuffle" onclick="shuffle()">Shuffle</button>
  <button class="btn" id="nextBtn" onclick="next()">Next &#8594;</button>
</div>
<div class="kbd-hints">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &middot; <kbd>Space</kbd> flip
</div>
<script>
const DATA = [
["In what specific part of New York City is the story \"The Last Leaf\" set?", "Greenwich Village"],
["Why did painters specifically choose to move to Greenwich Village?", "They liked the rooms with good light and low cost."],
["The streets of Greenwich Village are described as being broken into small pieces called _____.", "places"],
["From which state did Sue move before living in Greenwich Village?", "Maine"],
["From which state did Johnsy move before living in Greenwich Village?", "California"],
["Where did Sue and Johnsy first meet?", "A restaurant on Eighth Street"],
["List the three common interests that led Sue and Johnsy to live and work together.", "Art, food, and clothes"],
["During which season did Sue and Johnsy first decide to live together?", "Spring"],
["O. Henry personifies the sickness spreading through the city as a \"cold stranger\" named _____.", "Mr. Pneumonia"],
["How did the personified \"Mr. Pneumonia\" affect his victims physically?", "He touched them with his icy fingers."],
["Why did Pneumonia spread less quickly in Greenwich Village compared to the east side of the city?", "The streets in the Village were narrow and winding."],
["What was Johnsy doing as she lay in her bed while sick?", "Looking through the window at the wall of the house next door"],
["According to the doctor, what is the primary requirement for a sick person to have a chance at recovery?", "The person must want to live."],
["The doctor states that his work is half useless when a patient begins to feel they are _____.", "going to die"],
["What artistic goal did Johnsy hope to achieve one day in Italy?", "To paint the Bay of Naples"],
["What topic did the doctor suggest Sue use to interest Johnsy in the future?", "New winter clothes"],
["What was Sue doing as she entered Johnsy\u2019s room with her painting materials to hide her sadness?", "Singing"],
["When Sue first heard Johnsy speaking, what was Johnsy doing?", "Counting backward"],
["What was Johnsy specifically counting outside her window?", "The leaves falling from an old ivy tree"],
["How many leaves were left on the tree when Johnsy said, \"There are only five now\"?", "Five"],
["Johnsy believes that when the last leaf falls, she must _____.", "go (die)"],
["What lie does Sue tell Johnsy regarding the doctor\u2019s assessment of her health?", "She tells her the doctor said she had very good chances of getting well."],
["Why did Sue need to keep the window shade open while Johnsy was sick?", "She needed the light to finish a picture she was painting."],
["Whom did Sue call to act as a model for her painting of a man?", "Old Behrman"],
["On which floor of the building did Old Behrman live?", "The first floor"],
["How long had Behrman been a painter without achieving success?", "Forty years"],
["What did Behrman always talk about creating, though he never started it?", "A masterpiece"],
["How did Old Behrman earn a little money?", "By letting other artists paint pictures of him."],
["What was Behrman's initial reaction to Johnsy's idea that she would die when the leaves fell?", "He shouted in anger over such a foolish idea."],
["What were the weather conditions the night Sue and Behrman looked out at the ivy vine?", "A cold rain was falling mixed with snow."],
["What color was the last leaf at its edges as it hung twenty feet above the ground?", "Yellow"],
["What did Johnsy expect to happen to the last leaf during the night of the wild wind?", "She expected it to fall."],
["After the second night of rain and wind, what did Johnsy observe about the last leaf?", "The leaf was still there."],
["What did the persistence of the last leaf make Johnsy realize about her desire to die?", "She realized it was wrong to want to die."],
["What did Johnsy request to see herself in after she decided to try to eat?", "A looking-glass"],
["What was the name of the second person in the house who contracted pneumonia?", "Behrman"],
["How long was Behrman ill before he died in the hospital?", "Two days"],
["Where was Behrman found on the morning of his first day of illness?", "In his room"],
["In what condition were Behrman's shoes and clothes when he was found ill?", "They were wet and as cold as ice."],
["What specific painting materials were found in Behrman's room after he was taken to the hospital?", "Green paint and yellow paint"],
["What object did Behrman take outside with him on the cold, wild night?", "A light (lantern)"],
["What did Sue reveal the last leaf on the wall actually was?", "A painting by Behrman"],
["Why did the last leaf never move when the wind blew?", "It was painted directly onto the wall."],
["Sue refers to the painted leaf as Behrman's \"_____.\"", "great masterpiece"],
["Level L1 (Remember): Who wrote the short story \"The Last Leaf\"?", "O. Henry"],
["Level L2 (Understand): How does the story explain the term \"places\" in the context of Greenwich Village?", "They are small pieces of streets that turn in different directions."],
["Level L3 (Apply): How does Sue support her and Johnsy's living expenses while Johnsy is ill?", "She works on a picture to sell to buy food and supplies."],
["Level L4 (Analyze): How does the ending of the story serve as an irony regarding Behrman's career?", "He finally painted his masterpiece, but the act of creating it led to his death."],
["Level L5 (Evaluate): Why is Behrman's final act considered a \"self-sacrifice\"?", "He risked his health in a freezing storm to save Johnsy's life through his art."],
["Concept: Masterpiece", "Definition: A work of outstanding artistry or skill; in the story, it refers to the painted leaf that saved a life."],
["What does the doctor identify as the \"half his work\" that becomes useless?", "Treating a patient who has decided they are going to die."],
["What did Johnsy want to see fall before nightfall on her worst day?", "The last leaf"],
["What was the color of the last leaf near the branch?", "Dark green"],
["What did Johnsy call herself after seeing the last leaf survive the storm?", "A bad girl"],
["According to the final reveals, when did Behrman paint the leaf?", "The night that the last real leaf fell."],
["What does the \"cold breath of winter\" represent in the story's imagery?", "The arrival of illness and the death of nature's leaves."],
["Process: How did the neighbors discover Behrman had been outside during the storm?", "They found his wet, icy clothes, a lantern, and painting materials."],
["Why did Sue cry in the workroom before entering Johnsy's room?", "The doctor told her Johnsy had a very small chance of living."],
["What was the physical state of Johnsy as described by Sue when she was at her sickest?", "Very thin and very quiet."],
["Who was the model for Sue's painting of a man?", "Old Behrman"],
["How did the doctor describe Behrman\u2019s chances of recovery from pneumonia?", "He said there was no hope for him."],
["What did the doctor suggest Sue provide for Johnsy once she was out of danger?", "Food and care."],
["Where was the ivy leaf located in relation to the ground?", "Nearly twenty feet above the ground."],
["In the personification of Pneumonia, he is described as not being a \"nice old _____.\"", "gentleman"]
];
let order = [...Array(DATA.length).keys()];
let idx = 0;
const card = document.getElementById('card');
const qText = document.getElementById('questionText');
const aText = document.getElementById('answerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
function render() {
  const i = order[idx];
  qText.textContent = DATA[i][0];
  aText.textContent = DATA[i][1];
  card.classList.remove('flipped');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === order.length - 1;
  const pct = ((idx + 1) / order.length * 100).toFixed(0);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = (idx + 1) + ' / ' + order.length;
}
function flip() { card.classList.toggle('flipped'); }
function next() { if (idx < order.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; render();
}
document.getElementById('cardScene').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
