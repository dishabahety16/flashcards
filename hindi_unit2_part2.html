<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Unit 2 Part 2 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>Hindi &mdash; Unit 2 (Part 2)</h1>
<p class="subtitle">65 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["सबको पढाओ' कहानी के लेखक का नाम क्या है?", "प्रबोध कुमार गोविल।"], ["प्रबोध कुमार गोविल की रचनाओं का मुख्य केंद्र क्या है?", "सामाजिक चेतना और शिक्षा।"], ["प्रबोध कुमार गोविल किस साहित्यिक परंपरा के लेखक माने जाते हैं?", "सामाजिक यथार्थवाद की परंपरा।"], ["गोविल जी की लेखन-शैली की दो प्रमुख विशेषताएँ क्या हैं?", "सरल और सहज भाषा।"], ["लेखक के अनुसार समाज परिवर्तन का सबसे शक्तिशाली माध्यम क्या है?", "शिक्षा।"], ["स्मृति सूत्र 'PG-SEAM' में 'P' और 'G' का क्या अर्थ है?", "प्रबोध गोविल (Prabodh Govil)।"], ["स्मृति सूत्र 'PG-SEAM' में 'SEAM' का पूर्ण रूप क्या है?", "Social + Education + Awareness + Message।"], ["प्रबोध कुमार गोविल अपनी रचनाओं में किन सामाजिक वास्तविकताओं को विषय बनाते हैं?", "गरीबी, अशिक्षा और असमानता।"], ["सबको पढाओ' कहानी का मुख्य उद्देश्य किस अधिकार को उजागर करना है?", "शिक्षा का सार्वभौमिक अधिकार।"], ["गोविल की भाषा पाठकों पर क्या प्रभाव डालती है?", "यह संवेदनशील है और पाठक के मन को छू लेती है।"], ["स्मृति सूत्र 'GRIME' का संबंध किस लेखक से है?", "प्रबोध कुमार गोविल।"], ["स्मृति सूत्र 'GRIME' में 'R' और 'I' का क्या अर्थ है?", "Realism (यथार्थवाद) और Inspiration (प्रेरणा)।"], ["प्रबोध कुमार गोविल की रचनाएँ पाठक के लिए किन दो रूपों में कार्य करती हैं?", "प्रेरणा और जागृति।"], ["सबको पढाओ' कहानी का केंद्रीय कथानक क्या है?", "शिक्षा से वंचित समाज के अंतिम व्यक्ति तक ज्ञान पहुँचाना।"], ["कहानी के अनुसार अशिक्षा समाज में किन तीन समस्याओं को जन्म देती है?", "अंधविश्वास, गरीबी और असमानता।"], ["कहानी में बदलाव लाने के लिए किन व्यक्तियों की भूमिका महत्वपूर्ण दिखाई गई है?", "जागरूक और संवेदनशील व्यक्तियों की।"], ["स्मृति सूत्र 'LAST' में 'L' का क्या अर्थ है?", "Last person (अंतिम व्यक्ति)।"], ["अशिक्षित समाज में आर्थिक पिछड़ापन के साथ और क्या जड़ें जमाए रखता है?", "अंधविश्वास और सामाजिक कुरीतियाँ।"], ["कहानी के पात्र (जैसे किसान, मजदूर) किस सामाजिक वर्ग का प्रतिनिधित्व करते हैं?", "साधारण ग्रामीण वर्ग का।"], ["कहानी का प्रवाह किस क्रम में आगे बढ़ता है?", "समस्या से चेतना, चेतना से कार्य, और कार्य से परिवर्तन।"], ["स्मृति सूत्र 'PAT' में 'P' का क्या अर्थ है?", "Problem (अशिक्षा की समस्या)।"], ["स्मृति सूत्र 'PAT' में 'A' और 'T' का क्या अर्थ है?", "Awareness (जागरूकता) और Transformation (परिवर्तन)।"], ["वास्तविक जीवन में कहानी के संदेश को लागू करने का पहला कदम क्या होगा?", "शिक्षा-वंचित बच्चों की पहचान करना।"], ["अशिक्षा को दूर करने के लिए माता-पिता को क्या समझाना आवश्यक है?", "शिक्षा का महत्व और उसके दीर्घकालिक लाभ।"], ["स्मृति सूत्र 'ICARE' में 'I' और 'C' का क्या अर्थ है?", "Identify (पहचान) और Connect (जोड़ना)।"], ["स्मृति सूत्र 'ICARE' में 'R' और 'E' का क्या अर्थ है?", "Remove barriers (बाधाएं हटाना) और Educate all (सबको शिक्षित करना)।"], ["कहानी के तीन मुख्य विषय (Themes) क्या हैं?", "शिक्षा का अधिकार, सामाजिक परिवर्तन और असमानता उन्मूलन।"], ["स्मृति सूत्र 'ESI' में 'S' और 'I' का क्या अर्थ है?", "Social change (सामाजिक परिवर्तन) और Inequality (असमानता)।"], ["लेखक ने शिक्षा को जाति, वर्ग और लिंग से परे क्या माना है?", "हर बच्चे का मूल अधिकार।"], ["एक पढ़ा-लिखा समाज किन कुरीतियों से मुक्त हो सकता है?", "अंधविश्वास और सामाजिक बुराइयों से।"], ["सच्चा विकास कब संभव है?", "जब शिक्षा समाज के अंतिम व्यक्ति तक पहुँचती है।"], ["स्मृति सूत्र 'RCI' मॉडल का पूर्ण रूप क्या है?", "Right, Change, and Inequality removal।"], ["आधुनिक भारत में 'शिक्षा के अधिकार' का व्यावहारिक उदाहरण क्या है?", "आरटीई (Right to Education Act)।"], ["अशिक्षा को किस रूपक (Metaphor) द्वारा समझाया गया है?", "असमानता की जड़ के रूप में।"], ["स्मृति सूत्र 'IPO' मॉडल में 'I' (Input) क्या है?", "शिक्षा का अधिकार।"], ["स्मृति सूत्र 'IPO' मॉडल में 'O' (Output) क्या है?", "असमानता का उन्मूलन।"], ["सबको पढाओ' का मुख्य सामाजिक संदेश क्या है?", "शिक्षा प्रसार एक सामूहिक जिम्मेदारी है।"], ["कहानी की भाषा-शैली को किस प्रकार का बताया गया है?", "बोधगम्य और सरल बोलचाल की हिंदी।"], ["स्मृति सूत्र 'SLRC' में 'L' और 'R' का क्या अर्थ है?", "Language (सरल) और Relevance (प्रासंगिकता)।"], ["सबको पढाओ' को किस महान लेखक की साहित्यिक परंपरा में रखा जाता है?", "मुंशी प्रेमचंद।"], ["प्रेमचंद की परंपरा के अनुसार साहित्य क्या है?", "समाज का दर्पण।"], ["आलोचनात्मक दृष्टि से कहानी की एक मुख्य सीमा क्या है?", "यह मुख्य रूप से ग्रामीण संदर्भ तक सीमित है।"], ["स्मृति सूत्र 'MNLC' में 'N' और 'C' का क्या अर्थ है?", "Narrative (कथा-तकनीक) और Critical view (आलोचनात्मक दृष्टि)।"], ["समीक्षा के मानक 'SLMS' में 'M' का क्या अर्थ है?", "Merit (साहित्यिक महत्व)।"], ["क्या शिक्षा के बिना सामाजिक परिवर्तन स्थायी हो सकता है?", "नहीं, शिक्षा ही परिवर्तन का स्थायी आधार है।"], ["कहानी की भाषा ग्रामीण और शहरी दोनों पाठकों को कैसे जोड़ती है?", "सरल बोलचाल की शब्दावली के माध्यम से।"], ["स्मृति सूत्र 'SCALE' का प्रयोग किस कार्य के लिए किया जाता है?", "कहानी के पूर्ण मूल्यांकन के लिए।"], ["मूल्यांकन के अनुसार कहानी की सबसे बड़ी शक्ति क्या है?", "इसका सामाजिक संदेश और प्रासंगिकता।"], ["कहानी में शिक्षा को केवल सरकारी जिम्मेदारी न मानकर क्या माना गया है?", "एक सामूहिक सामाजिक दायित्व।"], ["डिजिटल युग में इस कहानी के संदेश को किन मुद्दों तक विस्तारित करने की आवश्यकता है?", "डिजिटल विभाजन और ऑनलाइन शिक्षा की असमानता तक।"], ["प्रबोध कुमार गोविल की लेखन-शैली को 'संवेदनशील' क्यों कहा गया है?", "क्योंकि यह पाठक को पात्रों के दुख-सुख से सीधे जोड़ती है।"], ["अशिक्षा के चक्र को तोड़ने के लिए जागरूक व्यक्ति को क्या बनना पड़ता है?", "परिवर्तन का उत्प्रेरक (Catalyst)।"], ["कहानी के अनुसार, बच्चों का स्कूल से बाहर होने का एक मुख्य कारण क्या है?", "गरीबी और माता-पिता की जागरूकता की कमी।"], ["शिक्षा किस प्रकार आत्मविश्वास बढ़ाती है?", "यह व्यक्ति को सोचने की शक्ति और आर्थिक स्वतंत्रता देती है।"], ["सबको पढाओ' में यथार्थवाद का क्या अर्थ है?", "समाज की समस्याओं का बिना किसी दिखावे के ईमानदार चित्रण।"], ["लेखक ने शिक्षा को 'हथियार' क्यों कहा है?", "क्योंकि यह सामाजिक बुराइयों से लड़ने में सक्षम है।"], ["ग्रामीण परिवेश में रात्रि-पाठशाला का क्या महत्व हो सकता है?", "खेतों में काम करने वाले बच्चों को शिक्षा से जोड़ना।"], ["क्या 'सबको पढाओ' केवल बच्चों के लिए प्रेरणादायक है?", "नहीं, यह पूरे समाज और अभिभावकों के लिए भी है।"], ["कहानी में 'मिशन' शब्द का प्रयोग किसके लिए किया गया है?", "शिक्षा के प्रसार के संकल्प के लिए।"], ["साहित्यिक मूल्यांकन में 'शिल्प' का क्या अर्थ है?", "कहानी कहने का तरीका और संरचना।"], ["गोविल जी ने अपनी रचनाओं के माध्यम से क्या संदेश दिया है?", "शिक्षा ही समाज सुधार की कुंजी है।"], ["अशिक्षा के कारण उत्पन्न 'असमानता' का एक उदाहरण दीजिए।", "अवसरों की कमी और आर्थिक शोषण।"], ["कहानी के पात्रों की भाषा कैसी है?", "स्वाभाविक और पात्रों के परिवेश के अनुकूल।"], ["क्या 'सबको पढाओ' एक कालजयी रचना है?", "हाँ, क्योंकि शिक्षा की समस्या हर युग में मौजूद है।"], ["शिक्षा के अधिकार (RTE) को लागू करने में कहानी के संदेश की क्या भूमिका है?", "यह सामाजिक जागरूकता पैदा कर कानून को प्रभावी बनाता है।"]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
