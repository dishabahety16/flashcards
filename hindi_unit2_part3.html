<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Unit 2 Part 3 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>Hindi &mdash; Unit 2 (Part 3)</h1>
<p class="subtitle">55 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["नियम' कहानी के लेखक का नाम क्या है?", "विजय अग्रवाल"], ["विजय अग्रवाल किस साहित्यिक विधा के लिए प्रसिद्ध हैं?", "कहानी विधा (Short Story)"], ["नियम' कहानी का केंद्रीय विषय (Central Subject) क्या है?", "सामाजिक नियमों और मानवीय संवेदना का टकराव।"], ["विजय अग्रवाल अपनी कहानियों में किस प्रकार की समस्याओं को उजागर करते हैं?", "सामाजिक समस्याएँ (Social issues)"], ["विजय अग्रवाल की भाषा-शैली की प्रमुख विशेषता क्या है?", "सरल और प्रभावशाली भाषा।"], ["विजय अग्रवाल अपनी लेखनी के लिए विषय कहाँ से चुनते हैं?", "आम जीवन की घटनाओं से।"], ["लेखक के नाम के लिए सुझाया गया स्मृति सूत्र (Memory Trick) क्या है?", "V.A. = 'Voice of the common man' (आम आदमी की आवाज़)।"], ["विजय अग्रवाल किस साहित्यिक धारा (Literary Tradition) के लेखक माने जाते हैं?", "सामाजिक यथार्थवाद (Social Realism)"], ["विजय अग्रवाल की कहानियाँ पाठक को क्या करने पर विवश करती हैं?", "सोचने और आत्म-मंथन करने पर।"], ["कहानी 'नियम' में नियमों की कठोरता का किसके साथ द्वंद्व दिखाया गया है?", "मानवीय संवेदना (Human sensitivity) के साथ।"], ["नियम' कहानी का मुख्य पात्र किस व्यवसाय से जुड़ा है?", "एक सरकारी कर्मचारी (Government employee)।"], ["कहानी के अनुसार, नियम व्यवस्था बनाए रखने के अलावा और क्या रूप ले सकते हैं?", "अन्याय और क्रूरता का रूप।"], ["कहानी में पात्रों के 'भीतरी' अनुभव को किस शब्द से परिभाषित किया गया है?", "आत्मसंघर्ष (Inner conflict)"], ["नियम यदि संवेदना-विहीन हो जाएँ, तो जीवन पर क्या प्रभाव पड़ता है?", "जीवन एक बोझ बन जाता है।"], ["कहानी पाठक के सामने कौन-सा यक्ष प्रश्न (Central Question) खड़ा करती है?", "क्या नियम मनुष्य के लिए हैं या मनुष्य नियमों के लिए?"], ["स्मृति सूत्र 'R-O-T' का पूर्ण रूप क्या है?", "Rules -> Order -> Trap (नियम -> व्यवस्था -> जाल)।"], ["कहानी का संकट-बिंदु (Crisis point) क्या है?", "जब नियम के कठोर पालन से किसी निर्दोष को हानि पहुँचती है।"], ["नियम और संवेदना के बीच उचित संबंध क्या होना चाहिए?", "नियमों को मानवीय मूल्यों के अनुरूप होना चाहिए।"], ["लेखक ने नियमों को साध्य (End) माना है या साधन (Means)?", "साधन (Means)"], ["कहानी में 'आत्मसंघर्ष' का क्या अर्थ दर्शाया गया है?", "बाहरी शांति और भीतरी पीड़ा के बीच का विरोधाभास।"], ["कर्तव्य बनाम करुणा' (Duty vs Compassion) का क्या तात्पर्य है?", "नियम का पालन करते हुए भी हृदय में दया का भाव रखना।"], ["नियम कब 'बंधन' (Chains) बन जाते हैं?", "जब वे मनुष्यता और संवेदना से खाली हो जाते हैं।"], ["स्मृति सूत्र 'S.R.C.' का क्या अर्थ है?", "Social Realism + Conflict (सामाजिक यथार्थवाद + संघर्ष)।"], ["कहानी के अनुसार, नियमों की पुनः समीक्षा कब आवश्यक हो जाती है?", "जब नियम मानवीय पीड़ा का कारण बनने लगें।"], ["नियम' कहानी में कितने प्रमुख विषय (Themes) बताए गए हैं?", "तीन (नियम vs मानवता, कर्तव्य vs करुणा, आत्मसंघर्ष)।"], ["पात्रों की मानसिक स्थिति का चित्रण विजय अग्रवाल कैसे करते हैं?", "कुशलतापूर्वक पात्रों की भीतरी व्याकुलता को शब्दों में उतारकर।"], ["सामाजिक व्यवस्था की नींव कब कमजोर होने लगती है?", "जब व्यवस्था नियमों को मानवता से ऊपर रख देती है।"], ["स्मृति सूत्र 'R-D-I' किन तीन विषयों को दर्शाता है?", "Rules (नियम), Duty (कर्तव्य), Inner Conflict (आत्मसंघर्ष)।"], ["नियम बनाम मानवता के संघर्ष को कैसा प्रश्न माना गया है?", "एक गहरा नैतिक प्रश्न (Moral question)।"], ["कहानी की आलोचनात्मक सराहना (Critical Appreciation) का मुख्य बिंदु क्या है?", "लेखक ने उत्तर देने के बजाय पाठक को प्रश्न दिया है।"], ["डिजिटल युग में 'नियम' कहानी की क्या प्रासंगिकता है?", "एल्गोरिदम और स्वचालित प्रणालियाँ भी संवेदना-हीन नियमों का पालन करती हैं।"], ["स्मृति सूत्र 'M.D.C.' का पूर्ण रूप क्या है?", "Man-made rules, Duty clash, Contradiction inside."], ["लेखक ने मनुष्य की आदर्श भूमिका क्या बताई है?", "मनुष्य नियमों का निर्माता और समीक्षक होना चाहिए, गुलाम नहीं।"], ["कहानी का सामाजिक संदेश किस प्रकार के समाज की कल्पना करता है?", "वह समाज जो अपने नियमों में मनुष्यता ढूँढ लेता है।"], ["नियमों को सत्ता का हथियार (Weapon of power) कब माना जाता है?", "जब वे अपने मूल उद्देश्य (लोक-कल्याण) से भटक जाते हैं।"], ["विजय अग्रवाल की शैली को किन दो तत्वों का संगम कहा गया है?", "सामाजिक यथार्थवाद और मनोवैज्ञानिक गहराई।"], ["स्मृति सूत्र 'H before R' का क्या अर्थ है?", "Humanity before Rules (नियमों से पहले मानवता)।"], ["कहानी के अनुसार 'सच्चा न्याय' क्या है?", "नियमों के दायरे में रहते हुए भी करुणामय निर्णय लेना।"], ["लेखक की 'सबसे बड़ी जीत' किसे माना गया है?", "जब कहानी पाठक को बदलाव के लिए बेचैन कर दे।"], ["K5 मूल्यांकन के अनुसार कहानी किन तीन दृष्टियों से सफल है?", "सामाजिक, साहित्यिक और नैतिक दृष्टियों से।"], ["नियम' कहानी को 'अमर रचना' क्यों कहा जाता है?", "क्योंकि नियम और मानवता का द्वंद्व हर युग में प्रासंगिक रहता है।"], ["स्मृति सूत्र 'S-L-E' का पूर्ण रूप क्या है?", "Social success, Literary depth, Ethical awakening."], ["जटिल नियम (Complex rules) आम आदमी के लिए क्या बन जाते हैं?", "व्यवस्था के स्थान पर एक बंधन।"], ["सरकारी कार्यालयों में 'नियम' का गलत प्रयोग कैसे होता है?", "नागरिकों को नियमों के नाम पर उनके अधिकारों से वंचित करके।"], ["पात्र का आत्मसंघर्ष किसका प्रमाण है?", "उसकी जीवित मानवता और नैतिक चेतना का।"], ["विजय अग्रवाल की कहानियों का मुख्य उद्देश्य क्या है?", "सामाजिक विसंगतियों पर प्रहार करना और मानवीय मूल्यों की स्थापना।"], ["नियमों और संवेदना के बीच 'संतुलन' को किसका आधार माना गया है?", "एक न्यायपूर्ण समाज की नींव।"], ["Cloze: 'नियम' कहानी _____ व्यवस्था में बनाए गए कठोर नियमों पर चोट करती है।", "सामाजिक"], ["Cloze: लेखक के अनुसार, नियम मनुष्य के लिए हैं, _____ नियमों के लिए नहीं।", "मनुष्य"], ["Cloze: विजय अग्रवाल की शैली _____ और मनोवैज्ञानिक गहराई का मेल है।", "सामाजिक यथार्थवाद"], ["Cloze: जब नियम मानवीय पीड़ा का कारण बनें, तो उनकी _____ अनिवार्य है।", "पुनः समीक्षा"], ["Cloze: कर्तव्य और _____ को एक साथ निभाना ही पात्र का मुख्य द्वंद्व है।", "करुणा"], ["परिभाषा: 'सामाजिक यथार्थवाद' (Social Realism) का 'नियम' के संदर्भ में क्या अर्थ है?", "समाज की वास्तविक समस्याओं और नियमों की क्रूरता का सच्चा चित्रण।"], ["उदाहरण: 'नियम बनाम मानवता' का एक वास्तविक उदाहरण दीजिए।", "अस्पताल में पैसे न होने पर कागजी नियमों के कारण इलाज से मना करना।"], ["प्रक्रिया: नियम को 'सत्ता का हथियार' बनने से कैसे रोका जा सकता है?", "नियमों में लचीलापन लाकर और मानवीय दृष्टिकोण को प्राथमिकता देकर।"]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
