<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Unit 3 Part 1 Flashcards</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Devanagari', Arial, sans-serif;
    background: #f5f3ef;
    color: #222;
    padding: 32px 16px 48px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 4px 0 2px;
    text-align: center;
    font-weight: 600;
  }
  .count {
    font-size: 0.95rem;
    color: #777;
    margin-bottom: 28px;
    text-align: center;
  }
  .card-wrap {
    width: 100%;
    max-width: 600px;
    perspective: 1500px;
    margin-bottom: 24px;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 280px;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 14px;
    padding: 36px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    border: 1px solid #e5e1d8;
  }
  .label {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .front {
    background: #ffffff;
  }
  .front .content {
    font-size: 1.2rem;
    line-height: 1.7;
    color: #1a1a1a;
  }
  .front .hint {
    margin-top: 20px;
    font-size: 0.82rem;
    color: #a8a8a8;
  }
  .back {
    background: #2b2b2b;
    color: #f5f3ef;
    transform: rotateY(180deg);
  }
  .back .label { color: #999; }
  .back .content {
    font-size: 1.08rem;
    line-height: 1.7;
  }
  .progress {
    font-size: 0.88rem;
    color: #888;
    margin-bottom: 14px;
  }
  .controls {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 11px 22px;
    border-radius: 8px;
    border: 1px solid #d8d4cb;
    cursor: pointer;
    background: #ffffff;
    color: #333;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #eeeae2; }
  button:active { transform: scale(0.97); }
  .keys {
    margin-top: 22px;
    font-size: 0.8rem;
    color: #999;
    text-align: center;
  }
  .keys kbd {
    background: #fff;
    border: 1px solid #d8d4cb;
    border-radius: 4px;
    padding: 2px 6px;
    font-family: inherit;
    font-size: 0.78rem;
  }
</style>
</head>
<body>
  <h1>Hindi &mdash; Unit 3 (Part 1)</h1>
  <div class="count">84 Flashcards</div>
  <div class="progress" id="progress"></div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face front">
        <div class="label">Question</div>
        <div class="content" id="frontContent"></div>
        <div class="hint">Tap to reveal answer</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="content" id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">&#8592; Prev</button>
    <button id="shuffleBtn">&#128256; Shuffle</button>
    <button id="nextBtn">Next &#8594;</button>
  </div>

  <div class="keys"><kbd>&#8592;</kbd> prev &nbsp; <kbd>Space</kbd> flip &nbsp; <kbd>&#8594;</kbd> next</div>

<script>
const CARDS = [{"q": "मुंशी प्रेमचंद का जन्म किस वर्ष और कहाँ हुआ था?", "a": "31 जुलाई 1880 को वाराणसी के निकट लमही गाँव में।"}, {"q": "प्रेमचंद का वास्तविक नाम क्या था?", "a": "धनपत राय श्रीवास्तव।"}, {"q": "प्रेमचंद को हिंदी साहित्य में किस उपाधि से सम्मानित किया गया है?", "a": "उपन्यास सम्राट।"}, {"q": "प्रेमचंद को 'कलम के सिपाही' के अलावा और किस नाम से जाना जाता है?", "a": "उपन्यास सम्राट।"}, {"q": "प्रेमचंद की साहित्यिक शैली को क्या कहा जाता है?", "a": "आदर्शोन्मुख यथार्थवाद (Idealism-oriented realism)।"}, {"q": "प्रेमचंद ने साहित्य को समाज का क्या माना है?", "a": "नैतिक दर्पण।"}, {"q": "कहानी 'नशा' किस प्रकार के साहित्य का उदाहरण है?", "a": "यथार्थवादी सामाजिक साहित्य।"}, {"q": "प्रेमचंद की मृत्यु कब हुई थी?", "a": "8 अक्टूबर 1936 को।"}, {"q": "कहानी 'नशा' के दो मुख्य पात्र कौन हैं?", "a": "कथावाचक (बीर) और ईश्वरी।"}, {"q": "कथावाचक के पिता का क्या व्यवसाय था?", "a": "वे एक गरीब क्लर्क थे।"}, {"q": "ईश्वरी के पिता की सामाजिक स्थिति क्या थी?", "a": "वे एक बहुत बड़े जमींदार थे।"}, {"q": "कथावाचक अक्सर जमींदारों की तुलना किससे करता था?", "a": "खून चूसने वाली जोंक से।"}, {"q": "दशहरे की छुट्टियों में ईश्वरी ने कथावाचक को कहाँ आमंत्रित किया?", "a": "अपने गाँव (जमींदारी संपत्ति पर)।"}, {"q": "स्टेशन पर यात्रा के लिए कथावाचक ने किस क्लास का टिकट लिया था?", "a": "सेकंड क्लास (ईश्वरी के साथ)।"}, {"q": "स्टेशन पर रिफ्रेशमेंट रूम में खानसामों का व्यवहार कथावाचक को बुरा क्यों लगा?", "a": "क्योंकि वे केवल ईश्वरी को महत्व दे रहे थे और कथावाचक की उपेक्षा कर रहे थे।"}, {"q": "ईश्वरी ने अपने परिवार से कथावाचक का परिचय किस रूप में कराया?", "a": "एक बहुत बड़ी रियासत के 'कुँवर साहब' के रूप में।"}, {"q": "ईश्वरी के अनुसार कथावाचक खद्दर क्यों पहनते थे?", "a": "क्योंकि वे महात्मा गाँधी के भक्त थे।"}, {"q": "ईश्वरी ने कथावाचक की सालाना रियासत कितने की बताई?", "a": "ढाई लाख रुपये की।"}, {"q": "गाँव पहुँचने पर कथावाचक के पाँव किसने दबाए?", "a": "एक नाई ने।"}, {"q": "कथावाचक ने किस नौकर पर लालटेन न जलाने के कारण क्रोध किया?", "a": "मुंशी रियासत अली पर।"}, {"q": "गाँव का वह पात्र कौन था जो कथावाचक को असली अमीर समझकर नौकरी माँगने आया?", "a": "एक ठाकुर (जो महात्मा गाँधी का भक्त था)।"}, {"q": "वापसी की यात्रा में कथावाचक को किस दर्जे (class) में सफर करना पड़ा?", "a": "तीसरे दर्जे (3rd Class) में।"}, {"q": "कहानी का चरमोत्कर्ष (climax) क्या है?", "a": "ट्रेन में कथावाचक द्वारा एक गरीब यात्री को थप्पड़ मारना।"}, {"q": "ट्रेन में यात्री को पीटने पर ईश्वरी ने बीर से क्या कहा?", "a": "\"What an idiot you are, Bir!\" (बीर, तुम कितने बड़े बेवकूफ हो!)।"}, {"q": "कथावाचक के चरित्र की मुख्य विशेषता क्या है?", "a": "वह विरोधाभासी और पाखंडी है।"}, {"q": "ईश्वरी का स्वभाव नौकरों के प्रति कैसा था?", "a": "कठोर और उद्दंड (बेदर्दी भरा)।"}, {"q": "ईश्वरी अपने दोस्तों और कथावाचक के साथ कैसा व्यवहार करता था?", "a": "नम्रता और सौहार्द से भरा हुआ।"}, {"q": "कथावाचक के अनुसार उसका लोकप्रेम किस पर टिका था?", "a": "निजी दशाओं पर (सिद्धांतों पर नहीं)।"}, {"q": "कहानी में रियासत अली और रामहरख कौन हैं?", "a": "ईश्वरी के घर के कर्मचारी/नौकर।"}, {"q": "कहानी में 'स्वामी-सेवक संबंध' का चित्रण किस प्रकार किया गया है?", "a": "नौकरों को केवल उनके काम (नाई, कहार) से पहचाना जाता है, मानवीय पहचान से नहीं।"}, {"q": "ईश्वरी के घर में नौकरों को मानवीय संवेदनाओं के बिना क्या माना जाता था?", "a": "केवल सेवा का एक साधन।"}, {"q": "कथावाचक का 'कुँवर साहब' बनने का स्वांग रचना क्या दर्शाता है?", "a": "उसकी आंतरिक वैचारिक कमजोरी और अवसरवादिता।"}, {"q": "बीर का चरित्र किस प्रकार का है: स्थिर (Static) या गतिशील (Dynamic)?", "a": "गतिशील (Dynamic), क्योंकि वह कहानी के दौरान बदलता है।"}, {"q": "ईश्वरी का चरित्र किस प्रकार का है: स्थिर (Static) या गतिशील (Dynamic)?", "a": "स्थिर (Static), उसका स्वभाव अंत तक एक जैसा रहता है।"}, {"q": "कहानी का मुख्य विषय क्या है?", "a": "सत्ता, धन और सामाजिक प्रतिष्ठा का नशा।"}, {"q": "कहानी का शीर्षक 'नशा' किस अर्थ में प्रतीकात्मक है?", "a": "यह शराब के नशे का नहीं, बल्कि वर्ग-अहंकार के नशे का प्रतीक है।"}, {"q": "कथावाचक के आचरण में 'पाखंड' (Hypocrisy) का उदाहरण दीजिए।", "a": "जमींदारी का विरोध करना लेकिन स्वयं जमींदारों जैसा क्रूर व्यवहार करना।"}, {"q": "कथावाचक के नैतिक पतन की प्रक्रिया के तीन चरण क्या थे?", "a": "नौकरों को डाँटना, मुंशी पर चिल्लाना और अंत में यात्री को मारना।"}, {"q": "कहानी में 'वर्ग-भेद' (Class discrimination) कहाँ दिखाई देता है?", "a": "स्टेशन पर खानसामों के व्यवहार और ट्रेन के अलग-अलग दर्जों में।"}, {"q": "कहानी में 'आत्म-जागृति' (Self-awakening) का क्षण कब आता है?", "a": "ट्रेन में जनता के विरोध और ईश्वरी के व्यंग्य के बाद।"}, {"q": "जमींदारी प्रथा के बारे में ईश्वरी के घरवालों का क्या विचार था?", "a": "कि ईश्वर ने असामियों को उनकी सेवा के लिए ही पैदा किया है।"}, {"q": "कथावाचक को अपनी धोती खुद छाँटने में शर्म क्यों आने लगी थी?", "a": "क्योंकि वह अब अमीरी के ठाठ-बाठ और 'कुँवर' बनने के नशे में था।"}, {"q": "कहानी का मूल सामाजिक संदेश क्या है?", "a": "बिना नैतिक चेतना के शक्ति मनुष्य को क्रूर बना देती है।"}, {"q": "प्रेमचंद के अनुसार सच्चा नशा किसका होता है?", "a": "वर्ग-विशेषाधिकार और सत्ता का।"}, {"q": "कहानी 'नशा' किस शैली में लिखी गई है?", "a": "प्रथम पुरुष (First-person) या आत्मकथात्मक शैली में।"}, {"q": "प्रथम पुरुष शैली के प्रयोग का क्या लाभ है?", "a": "पाठक कथावाचक के आंतरिक द्वंद्व और पाखंड को सीधे महसूस कर सकता है।"}, {"q": "प्रेमचंद ने कहानी में किस प्रकार की भाषा का प्रयोग किया है?", "a": "सरल, प्रवाहमयी और हिंदी-उर्दू मिश्रित भाषा।"}, {"q": "कहानी 'नशा' को 'सामाजिक दर्पण' क्यों कहा जाता है?", "a": "क्योंकि यह समाज की कड़वी सच्चाई और वर्ग-भेद को बिना सजावट के दिखाती है।"}, {"q": "कहानी के अंत में 'नशा उतरने' का क्या अर्थ है?", "a": "अहंकार का टूटना और वास्तविकता का बोध होना।"}, {"q": "क्या प्रेमचंद की 'नशा' आज के समय में प्रासंगिक है?", "a": "हाँ, क्योंकि पद और पैसे का घमंड आज भी मानवीय संवेदनाओं को नष्ट करता है।"}, {"q": "बीर ने ट्रेन में यात्री को क्यों मारा?", "a": "क्योंकि वह यात्री भीड़ में बीर के पास खड़ा होकर उसका 'दम घोंट' रहा था।"}, {"q": "कथावाचक के अनुसार ईश्वरी ने मुआमला किसके विवेक पर छोड़ दिया था?", "a": "कथावाचक के स्वयं के विवेक पर।"}, {"q": "स्टेशन पर ईश्वरी ने खानसामों को इनाम में क्या दिया?", "a": "एक अठन्नी।"}, {"q": "ईश्वरी के घर के फाटक की तुलना किससे की गई है?", "a": "इमा "}, {"q": "बीर का व्यवहार बदलने के पीछे मुख्य कारण क्या था?", "a": "अचानक मिला सम्मान, विलासिता और शक्ति का वातावरण।"}, {"q": "कहानी के अंत में जनता का बीर के प्रति क्या रवैया था?", "a": "तीव्र आक्रोश और घृणा का।"}, {"q": "प्रेमचंद की कहानियों का उद्देश्य केवल मनोरंजन नहीं, बल्कि _____ है।", "a": "समाज सुधार और नैतिक चेतना।"}, {"q": "बीर के द्वारा रियासत अली को डाँटना क्या सिद्ध करता है?", "a": "कि बीर के भीतर भी वही उद्दंडता आ गई थी जो रईसों में होती है।"}, {"q": "प्रेमचंद ने किस भाषा को अपनी रचनाओं का माध्यम बनाया?", "a": "हिन्दुस्तानी (हिंदी-उर्दू का मिला-जुला रूप)।"}, {"q": "कहानी में हाथी और घोड़े किसके प्रतीक हैं?", "a": "सामंती वैभव और जमींदारी शक्ति के।"}, {"q": "बीर के अनुसार क्या छोटे-बड़े हमेशा होते रहेंगे?", "a": "यह ईश्वरी की दलील थी जिसे बीर 'लचर' मानता था।"}, {"q": "कहानी 'नशा' की एक सीमा क्या मानी जा सकती है?", "a": "यह केवल व्यक्तिगत नैतिकता की बात करती है, व्यवस्था परिवर्तन का ठोस मार्ग नहीं बताती।"}, {"q": "प्रेमचंद के साहित्य में गरीबों और शोषितों के प्रति कैसी भावना दिखती है?", "a": "गहरी सहानुभूति और करुणा।"}, {"q": "बीर ने 'कुँवर' बनने का स्वांग कितनी सफाई से खेला?", "a": "इतनी सफाई से कि हर दिल पर अपनी 'देवत्व' की मुहर लगा दी।"}, {"q": "कहानी का समापन किस वाक्य के साथ होता है?", "a": "मेरा नशा अब कुछ-कुछ उतरता हुआ मालूम होता था।"}, {"q": "प्रेमचंद के अनुसार शक्ति मिलने पर मनुष्य अपनी _____ खो देता है।", "a": "इंसानियत और विवेक।"}];

let order = CARDS.map((_, i) => i);
let idx = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const frontEl = document.getElementById('frontContent');
const backEl = document.getElementById('backContent');
const progressEl = document.getElementById('progress');

function render() {
  const card = CARDS[order[idx]];
  frontEl.textContent = card.q;
  backEl.textContent = card.a;
  flipped = false;
  cardEl.classList.remove('flipped');
  progressEl.textContent = `${idx + 1} / ${CARDS.length}`;
}

function flip() {
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function next() {
  idx = (idx + 1) % order.length;
  render();
}

function prev() {
  idx = (idx - 1 + order.length) % order.length;
  render();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  render();
}

cardEl.addEventListener('click', flip);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', shuffle);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});

render();
</script>
