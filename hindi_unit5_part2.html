<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Unit 5 Part 2 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>Hindi &mdash; Unit 5 (Part 2)</h1>
<p class="subtitle">60 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["\"Receptionist\" का सही हिंदी तकनीकी नाम क्या है?", "स्वागतकर्ता"], ["विश्वविद्यालय के किसी विशेष विभाग या संकाय के प्रमुख को क्या कहते हैं?", "सांकाय-अध्यक्ष (Dean)"], ["गृह मंत्रालय के उस वरिष्ठ प्रशासनिक अधिकारी का पदनाम क्या है जो आंतरिक सुरक्षा संभालता है?", "गृह सचिव (Home Secretary)"], ["वह व्यक्ति जो किसी भाषा के व्याकरण और संरचना में निपुण हो, क्या कहलाता है?", "भाषा विशेषज्ञ (Language Expert)"], ["बच्चों के डॉक्टर के लिए प्रयुक्त तकनीकी शब्द क्या है?", "बाल चिकित्सक (Pediatrician)"], ["समाज या राजनीति पर कटाक्ष करने वाले चित्र बनाने वाले कलाकार को क्या कहते हैं?", "व्यंग्य चित्रकार (Cartoonist)"], ["पुस्तकों की सूची तैयार करने वाले व्यक्ति को हिंदी में क्या कहा जाता है?", "ग्रंथसूचीकार (Bibliographer)"], ["किसी विशेष शिकायत या घटना की जांच करने वाले अधिकारी का पदनाम क्या है?", "जांच अधिकारी (Enquiry Officer)"], ["सीमा पर लगने वाले शुल्क या कर का प्रबंधन करने वाला अधिकारी क्या कहलाता है?", "सीमाशुल्क अधिकारी (Custom Officer)"], ["कानूनों और नियमों का पालन सुनिश्चित करने वाले अधिकारी को क्या कहते हैं?", "प्रवर्तन अधिकारी (Enforcement Officer)"], ["दस्तावेजों और प्रमाणपत्रों की सत्यता की जांच करने वाले अधिकारी का नाम क्या है?", "सत्यपान अधिकारी (Verification Officer)"], ["किसी पूर्व सरकारी आदेश या नियम में आधिकारिक बदलाव की सूचना को क्या कहते हैं?", "संशोधन अधिसूचना (Amending Notification)"], ["वह तिथि जब कोई अधिकारी एक पद से मुक्त होकर दूसरे पद पर जाता है, उसे क्या कहते हैं?", "पदावमुक्ति दिनांक (Date of Relief)"], ["बैंक द्वारा अपने ग्राहक की ओर से दी गई लिखित गारंटी को हिंदी में क्या कहते हैं?", "बैंक प्रत्याभूति (Bank Guarantee)"], ["सरकार द्वारा किसी मुद्रा नोट की कानूनी मान्यता समाप्त करने की प्रक्रिया क्या कहलाती है?", "विमुद्रीकरण (Demonetization)"], ["किसी व्यवसाय में आने और जाने वाले धन की गति को क्या कहा जाता है?", "नकद प्रवाह (Cash Flow)"], ["शेयर या बॉन्ड पर छपे हुए मूल्य को हिंदी में क्या कहते हैं?", "अंकित मूल्य (Face Value)"], ["किसी सरकारी योजना पर किए जाने वाले कुल व्यय के लिए तकनीकी शब्द क्या है?", "वित्तीय परिव्यय (Financial Outlay)"], ["कानूनी तरीकों से अपनी कर देनदारी कम करने की प्रक्रिया क्या कहलाती है?", "कर परिहार (Avoidance of Tax)"], ["रेलवे स्टेशन पर यात्रियों को मार्ग और दिशा दिखाने वाले बोर्ड को क्या कहते हैं?", "मार्गसूचक (Route Indicator)"], ["निर्धारित समय से अधिक काम करने पर मिलने वाले भत्ते को क्या कहते हैं?", "समयोपरि भत्ता (Overtime Allowance)"], ["रेलवे पटरियों और पुलों की सुरक्षा सुनिश्चित करने वाले तकनीकी अधिकारी का पदनाम क्या है?", "पथ निरीक्षक (Track Inspector)"], ["रेलवे स्टेशन के प्रभारी या इंचार्ज को हिंदी में क्या कहा जाता है?", "स्टेशन प्रमुख (Station Master)"], ["आरक्षित सीट और बर्थ के विवरण वाली सूची को क्या कहते हैं?", "आरक्षण चार्ट (Reservation Chart)"], ["संकेत: सांकाय-अध्यक्ष। संदर्भ: विश्वविद्यालय। 'सांकाय' शब्द का अर्थ क्या है?", "विभाग या फैकल्टी (Faculty)"], ["सत्यापन अधिकारी का मुख्य कार्य क्या है?", "दस्तावेजों की प्रामाणिकता की जांच करना।"], ["प्रवर्तन अधिकारी (Enforcement Officer) और जांच अधिकारी (Enquiry Officer) के कार्यों में मुख्य अंतर क्या है?", "प्रवर्तन कानून लागू करता है, जबकि जांच अधिकारी किसी घटना की रिपोर्ट तैयार करता है।"], ["_____ को हमेशा राजपत्र (Gazette) में प्रकाशित किया जाता है ताकि वह कानूनी रूप से मान्य हो सके।", "संशोधन अधिसूचना"], ["सरकारी सेवा रिकॉर्ड में वेतन और वरिष्ठता की गणना के लिए _____ बहुत महत्वपूर्ण होता है।", "पदावमुक्ति दिनांक"], ["विमुद्रीकरण का एक ऐतिहासिक उदाहरण भारत में किस वर्ष देखा गया?", "वर्ष 2016 (₹500 और ₹1000 के नोट)"], ["अंकित मूल्य (Face Value) और बाज़ार मूल्य (Market Value) में मुख्य अंतर क्या है?", "अंकित मूल्य स्थिर और छपा हुआ होता है, जबकि बाज़ार मूल्य मांग के अनुसार बदलता है।"], ["क्या 'कर परिहार' (Tax Avoidance) एक अवैध प्रक्रिया है?", "नहीं, यह कानूनी रूप से मान्य है (कर चोरी अवैध है)।"], ["बैंक प्रत्याभूति (Bank Guarantee) में भुगतान की जिम्मेदारी कब बैंक पर आती है?", "जब ग्राहक (उधारकर्ता) अपना भुगतान करने में विफल रहता है।"], ["रेलवे में 'समयोपरि भत्ता' आमतौर पर सामान्य दर से कितने गुना दिया जाता है?", "1.5 गुना या 2 गुना।"], ["रिक्त स्थान भरें: _____ अधिकारी रेलवे पटरियों, पुलों और सुरंगों की तकनीकी सुरक्षा के लिए जिम्मेदार है।", "पथ निरीक्षक"], ["वाक्य प्रयोग: \"आगंतुक को बैठने का अनुरोध _____ ने किया।\"", "स्वागतकर्ता"], ["वाक्य प्रयोग: \"ठेकेदार ने परियोजना के लिए बैंक _____ प्रस्तुत की।\"", "प्रत्याभूति"], ["वाक्य प्रयोग: \"सरकार ने शिक्षा योजना के लिए ₹500 करोड़ का _____ निर्धारित किया।\"", "वित्तीय परिव्यय"], ["वाक्य प्रयोग: \"प्लेटफॉर्म संख्या 3 पर नया _____ स्थापित किया गया है।\"", "मार्गसूचक"], ["वाक्य प्रयोग: \"जांच अधिकारी ने अपनी _____ विभागाध्यक्ष को सौंपी।\"", "रिपोर्ट (या प्रतिवेदन)"], ["बाल चिकित्सक' शब्द किन दो मूल शब्दों के मेल से बना है?", "बाल (बच्चा) + चिकित्सक (डॉक्टर)"], ["प्रवर्तन' शब्द की संरचना क्या है?", "प्र (आगे) + वर्तन (कार्य करना/चलना)"], ["मार्गसूचक' शब्द में प्रयुक्त 'सूचक' का क्या अर्थ है?", "दिखाने वाला या संकेत देने वाला (Pointer/Indicator)"], ["वित्तीय शब्दावली के अनुसार 'नकद प्रवाह' सकारात्मक कब माना जाता है?", "जब धन का आगमन (Inflow) धन के बहिर्गमन (Outflow) से अधिक हो।"], ["\"Fixed Capital\" के लिए फैकल्टी नोट्स में कौन सा दूसरा शब्द दिया गया है?", "सावधि जमा"], ["\"Amount of Issue\" का हिंदी अनुवाद क्या है?", "निगम राशि"], ["\"Capital Resources\" के लिए 'पूंजीगत संसाधन' के अतिरिक्त कौन सा शब्द प्रयुक्त हुआ है?", "पूंजीगत सांस्पदनन"], ["खाते में प्रतिदिन बचने वाली शेष राशि को क्या कहते हैं?", "दैनिक शोष (Daily Balance)"], ["सत्यापन और जांच में क्या अंतर है?", "सत्यापन पूर्व-निवारक है (प्रमाणिकता), जांच घटना के बाद की प्रक्रिया है।"], ["सरकारी पत्राचार में 'ने' (ne) का प्रयोग कब किया जाता है?", "जब कर्ता (Designation) के बाद भूतकाल की सकर्मक क्रिया हो।"], ["प्रशासनिक हिंदी में क्या पदनामों का लिंग परिवर्तन (स्त्रीलिंग) करना अनिवार्य है?", "नहीं, आधिकारिक हिंदी में पदनाम प्रायः लिंग-तटस्थ रहते हैं।"], ["भारतीय रेलवे में पटरियों में दोष की सूचना देने का उत्तरदायित्व किसका है?", "पथ निरीक्षक"], ["\"Amending Notification\" पूर्व आदेश को रद्द करता है या उसमें बदलाव?", "केवल आवश्यक बदलाव (संशोधन) करता है।"], ["रिक्त स्थान: 2016 के विमुद्रीकरण के बाद देश में _____ संकट उत्पन्न हुआ था।", "नकद"], ["किसी शेयर का अंकित मूल्य और बाज़ार मूल्य के अंतर को क्या कहते हैं?", "प्रीमियम"], ["ट्रेन के गार्ड द्वारा जारी किए जाने वाले प्रमाणपत्र को क्या कहते हैं?", "गार्ड प्रमाणपत्र (Guard Certificate)"], ["हिंदी तकनीकी शब्दावली बनाने की मुख्य पद्धति क्या है?", "समास-पद्धति (दो सरल शब्दों को जोड़ना)"], ["\"Enforcement Officer\" का उच्चारण/वर्तनी फैकल्टी नोट्स के अनुसार क्या है?", "प्रवर्तन अधिकारी"], ["\"Date of Relief\" का प्रशासनिक उपयोग कहाँ होता है?", "स्थानांतरण (Transfer) के समय सेवा रिकॉर्ड में।"], ["रेलवे कर्मचारी को अतिरिक्त काम के लिए मिलने वाला भुगतान _____ कहलाता है।", "समयोपरि भत्ता"]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
