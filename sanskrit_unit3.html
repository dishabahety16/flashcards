<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanskrit Unit 3 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>Sanskrit &mdash; Unit 3</h1>
<p class="subtitle">88 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Who is the author of the संस्कृत (Sanskrit) epic किरातार्जुनीयम् (Kirātārjunīyam)?", "भारविः (Bhāravi)"], ["The epic किरातार्जुनीयम् (Kirātārjunīyam) consists of how many cantos or सर्गाः (sargas)?", "18 cantos"], ["In which specific section of the महाभारतम (Mahābhāratam) is the source story of the किरातार्जुनीयम् (Kirātārjunīyam) found?", "वनपर्व (Vana Parva)"], ["The title किरातार्जुनीयम् (Kirātार्junīyam) refers to an encounter between अर्जुनः (Arjuna) and which deity in disguise?", "शिवः (Śiva)"], ["What powerful weapon does अर्जुनः (Arjuna) seek to acquire in the epic किरातार्जुनीयम् (Kirātārjunīyam)?", "पाशुपतास्त्रम् (Pāśupatāstram)"], ["What is the primary external evidence used to date the poet भारविः (Bhāravi) to the 6th century A.D.?", "The Aihole inscription of 634 A.D."], ["What is the dominant रसः (rasa) or emotional sentiment of the किरातार्जुनीयम् (Kirātārjunīyam)?", "वीररसः (vīrarasaḥ) or the heroic sentiment"], ["For which literary quality is भारविः (Bhāravi) most celebrated according to the famous Sanskrit phrase?", "अर्थगौरवम् (arthagauravam), meaning depth or weight of meaning"], ["Which canto of the किरातार्जुनीयम् (Kirātārjunīyam) is famous for its use of linguistic virtuosity like श्लेषः (puns) and यमकम् (alliteration)?", "The 15th canto"], ["How does the style of भारविः (Bhāravi) mark a transition in the history of संस्कृत (Sanskrit) epic poetry?", "He moved epic poetry from the natural simplicity of कालिदासः to a more elaborate, artificial style."], ["Identify the author of the महाकाव्यम् (Mahākāvya) titled शिशुपालवधम् (Śiśupālavadham).", "माघः (Māgha)"], ["The महाकाव्यम् (Mahākāvya) written by माघः (Māgha) contains how many cantos?", "20 cantos"], ["According to tradition, which three poetic qualities are combined in the works of माघः (Māgha)?", "उपमा (simile), अर्थगौरवम् (depth of meaning), and पदलालित्यम् (grace of diction)"], ["What structural innovation did भारविः (Bhāravi) introduce that was later imitated by माघः (Māgha)?", "Detailed discussions of राजनीतिः (statecraft/politics) within the epic form"], ["Translate the following verse often cited as the prime example of भारवि's अर्थगौरवम्:\nसहसा विदधीत न क्रियामविवेकः परमं पदम् ।\nवृणुते हि विमृश्यकारिणं गुणलुब्धाः स्वयमेव सम्पदः ॥", "One should not act rashly; lack of discrimination is the source of great disasters. Prosperity, attracted by virtues, chooses of its own accord the person who acts with reflection."], ["In Verse 16 of the रघुवंशम् (Raghuvaṃśam), why is King दिलीपः (Dilīpa) compared to the ocean?", "Because he was both terrifying (भीम) and charming (कान्त) at the same time."], ["According to Verse 16, King दिलीपः (Dilīpa) was unapproachable to wrongdoers but accessible to his dependents. What are the Sanskrit terms for these two states?", "अधृष्यः (unapproachable) and अभिगम्यः (accessible)"], ["Concept: Verse 17 of Canto I, रघुवंशम् (Raghuvaṃśam)", "It describes how subjects followed the path of Manu's law without the slightest deviation, like a wheel rim following a skilled charioteer."], ["In Verse 17, the path followed by the people is said to be established from the age of which legendary figure?", "मनुः (Manu)"], ["What phrase in Verse 17 indicates that the subjects of दिलीपः (Dilīpa) did not deviate even by the width of a single line?", "रेखामात्रमपि (rekhāmātramapi)"], ["What is the primary motivation for King दिलीप's tax collection according to Verse 18?", "प्रजानामेव भूत्यर्थम् (for the welfare of the subjects alone)"], ["Verse 18 uses a simile of the Sun (रविः) to explain taxation. What action of the sun parallels tax collection?", "The sun draws up water (रसं) only to return it thousandfold as rain."], ["In Verse 19, कालिदासः (Kālidāsa) describes the army of King दिलीपः (Dilīpa) as a _____.", "परिच्छदः (accessory or ornament)"], ["According to Verse 19, what were the two real means of accomplishment for King दिलीपः (Dilīpa)?", "Unblunted intelligence in the sciences (शास्त्रेष्वकुण्ठिता बुद्धिः) and a taut bowstring (मौर्वी धनुषि)."], ["Verse 20 compares King दिलीप's secret plans (मन्त्रः) to what metaphysical concept?", "संस्काराः प्राक्तनाः (impressions or karmic seeds from previous births)"], ["According to Verse 20, by what means can the secret pursuits of King दिलीपः (Dilīpa) be known?", "फलानुमेयाः (inferred from the results alone)"], ["List the four balanced qualities of King दिलीप's personal life mentioned in Verse 21.", "Fearless self-protection, disease-free duty, greedless wealth, and unattached pleasure."], ["In Verse 21, what term is used to describe दिलीप's enjoyment of comforts without attachment?", "असक्तः (asaktaḥ)"], ["Verse 22 highlights the coexistence of opposite virtues. What is the 'opposite' virtue paired with 'Knowledge' (ज्ञानम्)?", "मौनम् (silence or quietude)"], ["In Verse 22, the virtue of 'Forbearance' (क्षमा) is impressive because King दिलीपः (Dilīpa) also possessed _____.", "शक्तिः (power)"], ["What sibling-related metaphor does कालिदासः (Kālidāsa) use in Verse 22 to describe the king's virtues?", "सप्रसवाः (born of the same womb)"], ["According to Verse 23, what paradoxical state did दिलीपः (Dilīpa) achieve even without old age?", "वृद्धत्वम् (vṛddhatvam), meaning maturity or agedness of wisdom."], ["What were the two causes of King दिलीप's premature maturity according to Verse 23?", "Mastery of all sciences (विद्यानां पारदृश्वनः) and not being drawn by sensual pleasures."], ["Why does Verse 24 claim that King दिलीपः (Dilīpa) was the 'true father' of his subjects?", "Because he educated, protected, and supported them."], ["In Verse 24, what role is attributed to the biological fathers (पितरः) in contrast to the king?", "जन्महेतवः केवलम् (merely the causes of birth)"], ["What are the three specific paternal duties of the king mentioned in Verse 24?", "विनयाधानम् (education), रक्षणम् (protection), and भरणम् (sustenance)."], ["According to Verse 25, how were the goals of अर्थ (wealth) and काम (pleasure) transformed for King दिलीपः (Dilīpa)?", "They became धर्म (righteousness) itself because they were directed to noble purposes."], ["In Verse 25, what was the specific purpose of King दिलीप's marriage (परिणयः)?", "प्रसूतये (only for the sake of progeny)"], ["In Verse 25, why did King दिलीपः (Dilīpa) punish the punishable?", "स्थित्यै (for the maintenance of law and order)"], ["Verse 26 describes an exchange of wealth between King दिलीपः (Dilīpa) and which deity?", "मघवा (Indra)"], ["According to Verse 26, for what purpose did King दिलीपः (Dilīpa) 'milk' the earth?", "यज्ञाय (to perform sacrifices)"], ["According to Verse 26, for what purpose did इन्द्रः (Indra) 'milk' heaven?", "सस्याय (for the growth of grain crops through rain)"], ["What term in Verse 26 defines the mutual relationship between the King and the King of Gods?", "सम्पद्विनिमयः (exchange of wealth)"], ["How does Verse 27 describe the prevalence of 'theft' (तस्करता) during Dilīpa's reign?", "It survived only as a word in language (श्रुतौ), not as a physical act."], ["In Verse 28, to what is an acceptable virtuous enemy compared?", "Bitter medicine (औषधम्) to a sick person."], ["In Verse 28, to what is a wicked person compared, even if they are dear to the king?", "A finger bitten by a snake (उरगक्षता अङ्गुली) that must be cut off."], ["What principle of governance is illustrated by the medicine and snake-bite similes in Verse 28?", "Moral impartiality (judging by virtue, not personal attachment)."], ["According to Verse 29, with what did the creator ब्रह्मा (Brahmā) compose the body of King दिलीपः (Dilīpa)?", "महाभूतसमाधिना (a grand convergence/concentration of the five elements)"], ["What evidence is cited in Verse 29 to prove King दिलीप's extraordinary creation?", "All his qualities bore fruit solely for the welfare of others (परार्थैकफलाः)."], ["The phrase परार्थैकफलाः गुणाः in Verse 29 describes qualities that exist exclusively for what?", "The benefit of others."], ["In Verse 30, the entire earth (उर्वी) is compared to a single _____.", "एकपुरी (single city)"], ["What natural feature serves as the rampart (वप्र) of King दिलीप's earth-city in Verse 30?", "The sea-shores (वेला)."], ["What natural feature serves as the moat (परिखा) of King दिलीप's earth-city in Verse 30?", "The oceans (सागराः)."], ["The term अनन्यशासनाम् in Verse 30 indicates what about King दिलीप's sovereignty?", "That he ruled without any other rival or competing authority; universal sovereignty."], ["What is the poetic metre used for the description of दिलीपः (Dilīpa) in Canto I of the रघुवंशम् (Raghuvaṃśam)?", "उपजाति (Upajāti)"], ["Concept: अर्थगौरवम् (Arthagauravam)", "The capacity to compress profound meaning into brief, weighty diction; famously associated with the poet भारविः."], ["Which Sanskrit commentator is known for the remark 'माघे मेघे गतं वयः'?", "मल्लिनाथः (Mallinātha)"], ["In the context of the रघुवंशम्, what does the term प्रजानां भूत्यर्थम् mean regarding the king's treasury?", "It means the wealth is collected solely for the prosperity and welfare of the subjects."], ["How does Verse 21 describe King दिलीप's approach to wealth (अर्थः)?", "He secured it without greed (अगृध्रुः)."], ["Concept: पञ्चभूतानि (Pañcabhūtāni) in Verse 29", "The five great elements (earth, water, fire, air, space) used by Brahmā to create Dilīpa's unique altruistic character."], ["Cloze: In Verse 19, कालिदासः states that Dilīpa's army was merely an accessory, as his real strength lay in his ____.", "intelligence and bow"], ["Which text serves as the model for later संस्कृत (Sanskrit) poets like माघः in terms of artificial style and statecraft discussion?", "किरातार्जुनीयम् (Kirātārjunīyam)"], ["What is the literal meaning of the word 'किरात' (kirāta) in the title of भारवि's work?", "A hunter or mountain-dweller."], ["How does Verse 25 interpret King दिलीप's use of दण्ड (punishment)?", "As an act of धर्म (righteousness) intended for the maintenance of social stability."], ["Identify the figure of speech in Verse 22 where knowledge is paired with silence.", "विरोध-अलङ्कारः (Virodha-alaṃkāra) or apparent contradiction."], ["What does the phrase 'तावद्भारविभूतिर्न तावत्माघस्य नोदयः' suggest about the relationship between the two poets?", "It suggests that Bhāravi's fame was supreme until the rise of Māgha."], ["Term: सात्त्विकगुणाः (Sāttvika-guṇas)", "Pure, balanced qualities such as equanimity and self-restraint, exemplified by King दिलीपः in verses 21–22."], ["In the context of Verse 26, how does इन्द्रः reciprocate the sacrifices performed by King दिलीपः?", "By providing sufficient rain to sustain crops."], ["What does the term 'अनन्यशासना' imply about the extent of the Solar Race's empire?", "The empire had no rival rulers and covered the entire known earth."], ["How does Verse 23 define maturity (वृद्धत्वम्) differently from the biological passage of time?", "As a state achieved through mastery of learning and self-control, regardless of age."], ["Which Sanskrit scholar's vocabulary was so vast it was said that no new word remained after studying nine cantos of his work?", "माघः (Māgha)"], ["Name the four traditional 'Vidyās' or sciences mentioned in the Teacher Notes for Verse 23.", "1. Logic (आन्वीक्षिकी), 2. Vedas (त्रयी), 3. Practical Arts (वार्ता), 4. Statecraft (दण्डनीति)."], ["In Verse 27, the word 'श्रुतौ' implies that theft existed only in _____.", "words or sacred texts (as a historical concept)"], ["According to the analysis of Verse 20, why is the comparison to 'past impressions' (संस्काराः) apt for Dilīpa's statecraft?", "Because both remain hidden from view until the final results manifest."], ["What does the term 'अत्रस्तः' in Verse 21 reveal about the king's self-protection?", "He protected his body without being motivated by fear or anxiety."], ["Concept: पुरुषार्थाः (Puruṣārthas) in Verse 25", "The four goals of human life (Dharma, Artha, Kāma, Mokṣa) where the first directs and sanctifies the other two."], ["In Verse 30, the ocean is described as 'परिखीकृत', meaning it has been made into a _____.", "moat"], ["What is the significance of the 634 A.D. date in the study of भारविः?", "It is the date of the Aihole inscription which mentions him, providing a firm terminus ante quem for his life."], ["Which poet is known as the 'model' for the artificial and elaborate style seen in the 8th century A.D.?", "भारविः (Bhāravi)"], ["What is the primary difference in canto counts between किरातार्जुनीयम् and शिशुपालवधम्?", "किरातार्जुनीयम् has 18 cantos; शिशुपालवधम् has 20 cantos."], ["Translate the phrase: 'प्रजानां विनयाधानाद्रक्षणाद्भरणादपि' from Verse 24.", "By instilling humility, by protecting them, and by supporting them."], ["Explain the concept of 'अकुण्ठिता बुद्धिः' from Verse 19.", "It means 'unblunted' or 'undulled' intelligence, which remains sharp and effective in all sciences."], ["In the comparison in Verse 18, 'रविः' represents the King, and 'रसं' (water) represents _____.", "taxes (बलिः)"], ["Why is the 15th Canto of the किरातार्जुनीयम् considered a 'tour de force' of verbal artistry?", "It features complex literary devices like palindromes and verses containing only one or two consonants."], ["What does the 'Ocean' simile in Verse 16 suggest about the balance of a ruler's personality?", "A ruler must be simultaneously respected for their power and beloved for their benevolence."], ["According to the text, what is the 'signature' word भारवि uses at the end of each canto?", "लक्ष्मी (Lakṣmī)"], ["According to the text, what 'signature' word does माघ start and end his cantos with?", "श्री (Śrī)"], ["The phrase 'माघे मेघे गतं वयः' refers to the works of which two authors?", "माघः (Māgha) and कालिदासः (Kālidāsa, specifically his Meghadūta)."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
