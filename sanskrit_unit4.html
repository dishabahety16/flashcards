<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanskrit Unit 4 Flashcards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f3ee;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2a2a;padding:1.5rem 1rem 2rem}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:#2d5a7b;margin-top:.8rem;text-align:center}
.subtitle{font-size:.92rem;color:#8a8275;margin:.35rem 0 1.2rem;text-align:center}
.progress-wrap{width:100%;max-width:560px;margin-bottom:.6rem;display:flex;align-items:center;gap:.6rem}
.progress-track{flex:1;height:4px;background:#ddd7cd;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#2d5a7b;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:.78rem;color:#8a8275;white-space:nowrap}
.scene{width:100%;max-width:560px;height:320px;perspective:900px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:2rem 2.25rem;display:flex;flex-direction:column;overflow-y:auto}
.card-front{background:#fff;border:1px solid #d6cfc4;box-shadow:0 2px 20px rgba(26,35,50,.08)}
.card-back{background:#2d5a7b;color:#f0f6fa;transform:rotateY(180deg);box-shadow:0 2px 20px rgba(26,35,50,.12)}
.card-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.8rem;opacity:.55;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card-back .card-label{color:#a9cbd9}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1.55}
.card-hint{font-size:.72rem;text-align:center;color:#b5ae9e;margin-top:.8rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{display:flex;gap:.65rem;margin-top:1rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 1.3rem;border-radius:8px;border:1px solid #d6cfc4;background:#fff;color:#2d5a7b;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.btn:hover{background:#eae6df}
.btn:disabled{opacity:.35;cursor:default}
.btn.shuffle{border-style:dashed}
.kbd-hints{margin-top:.8rem;font-size:.72rem;color:#b5ae9e;text-align:center}
.kbd{display:inline-block;background:#eae6df;border:1px solid #d6cfc4;border-radius:4px;padding:.1em .45em;font-family:monospace;font-size:.72rem;margin:0 .1em}
@media(max-width:480px){
  .scene{height:290px}
  .card-face{padding:1.5rem 1.25rem}
  .card-text{font-size:1rem}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<h1>Sanskrit &mdash; Unit 4</h1>
<p class="subtitle">65 Flashcards</p>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="pf"></div></div><span class="progress-label" id="pl"></span></div>
<div class="scene" id="scene">
<div class="card" id="card">
<div class="card-face card-front">
<div class="card-label">Question</div>
<div class="card-text" id="qtext"></div>
<div class="card-hint">Tap to reveal answer</div>
</div>
<div class="card-face card-back">
<div class="card-label">Answer</div>
<div class="card-text" id="atext"></div>
</div>
</div>
</div>
<div class="controls">
<button class="btn" id="prev" onclick="go(-1)">&larr; Prev</button>
<button class="btn shuffle" id="shuf" onclick="shuffle()">&#x1F500; Shuffle</button>
<button class="btn" id="next" onclick="go(1)">Next &rarr;</button>
</div>
<p class="kbd-hints"><kbd class="kbd">&larr;</kbd> prev &nbsp; <kbd class="kbd">Space</kbd> flip &nbsp; <kbd class="kbd">&rarr;</kbd> next</p>
<script>
const DATA=[["Who were the parents of the poet Śrī Harṣa (श्रीहर्षः)?", "Hīra (हीरः) and Māmalladevī (मामल्लदेवी)."], ["What is the alternative popular name for Harṣa's work 'Naiṣadhīyacaritam' (नैषधीयचरितम्)?", "Naiṣadham (नैषधम्)."], ["Śrī Harṣa's 'Naiṣadhīyacaritam' is recognized as the last of which canonical group of five Sanskrit epics?", "The पञ्चमहाकाव्यानि (Pañcamahākāvyāni)."], ["Which two kings of Kanauj in the 12th century A.D. patronized Śrī Harṣa?", "Vijayacandra (विजयचन्द्र) and Jayacandra (जयचन्द्र)."], ["How many cantos of 'Naiṣadhīyacaritam' are currently available to readers?", "22 cantos (of the original 60)."], ["What is the narrative source of Śrī Harṣa's 'Naiṣadham'?", "The 'Nalopākhyānam' (नलोपाख्यानम्) of the Mahābhārata."], ["What metaphor does the term 'Nārikelapāka' (नारिकेलपाकम्) use to describe Harṣa's difficult poetic style?", "A coconut: a hard outer shell requiring a commentary to reach the sweet meaning within."], ["Why is 'Naiṣadhīyacaritam' classified as a 'Śāstrakāvya' (शास्त्रकाव्यम्)?", "Because it embeds topics and arguments from various sciences like grammar and philosophy."], ["The epithet 'Vidvadauṣadham' (विद्वदौषधम्) suggests that Harṣa's work is _____ for scholars.", "Medicine."], ["Which two rhetorical figures (अलङ्काराः) does Śrī Harṣa primarily employ?", "Atiśayokti (अतिशयोक्ति — hyperbole) and Utprekṣā (उत्प्रेक्षा — poetic fancy)."], ["What is Harṣa's famous boast regarding the accessibility of his work?", "मूढैः न अस्मिन् खलाः खेलन्तु (Fools have no place playing with this work)."], ["Name the celebrated Vedānta work in verse authored by Śrī Harṣa.", "Khaṇḍanakhaṇḍakhādyam (खण्डनखण्डखाद्यम्)."], ["In Verse 31 of Raghuvaṁśa, Queen Sudakṣiṇā is said to belong to which dynasty?", "The Magadha dynasty (मगधवंशजा)."], ["What poetic device (अलङ्कारः) is used in Verse 31 to link the queen's name to a sacrificial fee?", "Śleṣa (श्लेषः — a pun/double meaning)."], ["According to the pun in Verse 31, Queen Sudakṣiṇā is like the _____ of a sacrifice.", "Dakṣiṇā (दक्षिणा — sacrificial fee)."], ["Term: Ekapatnī-vrata (एकपत्नीव्रतम्)", "Definition: The vow of being devoted to only one wife, observed by King Dilīpa despite his large harem."], ["In Verse 33, what was the primary cause of King Dilīpa's longing?", "The desire for a son (आत्म्जन्म-समुत्सुकः)."], ["What does the phrase 'vilambitaphalaiḥ manorathaiḥ' (विलम्बितफलैः मनोरथैः) indicate about Dilīpa's prayers?", "His desires were righteous, but their fulfillment (a son) was long delayed."], ["To whom did Dilīpa entrust the 'yoke of the kingdom' (धुः) before his journey?", "His ministers (सचिवेषु)."], ["Which deity did the royal couple worship in Verse 35 before departing for the hermitage?", "Brahmā (विधातारम् — the Creator)."], ["Where was the destination of the royal couple's journey in Raghuvaṁśa Canto I?", "The hermitage (आश्रमम्) of Sage Vasiṣṭha."], ["In the divine simile of Verse 36, who is Dilīpa compared to?", "Airāvata (ऐरावतः — Indra's divine elephant)."], ["In the divine simile of Verse 36, what does Queen Sudakṣiṇā represent?", "Lightning (विद्युत्)."], ["In Verse 36, the chariot's rumble is compared to a _____.", "Rain cloud (पयोवाहः)."], ["Why did Dilīpa's small retinue appear like a great army (v. 37)?", "Because of their innate majesty and charisma (अनुभावविशेषात्)."], ["In Verse 38, what two things do the breezes bring to serve the king?", "Coolness and the fragrance of Śāla tree pollen."], ["What musical note (स्वरः) is the peacocks' cry (केका) associated with in Verse 39?", "Ṣaḍja (षड्जम् — the first note of the scale)."], ["Why do the peacocks mistake the chariot for a thundercloud in Verse 39?", "Because of the chariot's deep and pleasant rumble (स्निग्धगम्भीरनिर्घोषम्)."], ["In Verse 40, the eyes of the royal couple are compared to the eyes of _____.", "Deer (मृगद्वन्द्वेषु)."], ["In Verse 41, the row of cranes is imagined as a pillarless _____ in the sky.", "Gateway garland (अस्तम्भं तोरणस्रजम्)."], ["How does the favorable wind (अनुकूलः वातः) act as an omen in Verse 42?", "It foretells the fulfillment of their prayer for a son."], ["According to Verse 42, what did the favorable wind prevent from touching the couple?", "Dust raised by the horses' hooves."], ["In Verse 43, the fragrance of the lotuses is compared to the couple's _____.", "Sighs or breath (निःश्वास)."], ["What were the 'Agrahāras' mentioned in Verse 44?", "Villages donated by the king to Brahmins for sacrificial rites."], ["By what physical marker were the donated villages in Verse 44 identified?", "Sacrificial posts (यूपचिह्नानि)."], ["What offering did the old cowherds (घोषवृद्धाः) bring to the king in Verse 45?", "Fresh butter (हैयङ्गवीनम्)."], ["What did King Dilīpa ask the cowherds about during the journey (v. 45)?", "The names of the wild roadside trees (वन्यानां मार्गशाखिनाम्)."], ["Which commentator wrote authoritative glosses on all five Pañcamahākāvyas?", "Mallinātha (मल्लिनाथः)."], ["What is the primary rhetorical figure of 'excess' favored by Śrī Harṣa?", "Atiśayokti (अतिशयोक्ति — hyperbole)."], ["Concept: Prayatau (प्रयतौ)", "In Verse 35, this dual term indicates that both the king and queen were in a state of ritual purification and discipline."], ["What does the phrase 'ātmajanma-samutsukaḥ' imply about Dilīpa's motivation?", "He was intensely eager for the birth of a son (his 'own self born')."], ["The phrase 'vanavandana' in Verse 38 refers to _____ paying homage to the king.", "The forest."], ["Which note is the peacock said to divide into 'pure' and 'modified' tones?", "The Ṣaḍja (षड्ज) note."], ["What quality of the royal couple caused them to appear as an army despite having few soldiers?", "Their innate majesty (Anubhāva / अनुभाव)."], ["Identify the four canonical Pañcamahākāvyas besides Naiṣadhīyacaritam.", "Raghuvaṁśa, Kumārasambhava, Kirātārjunīyam, and Śiśupālavadham."], ["Who authored the 'Kirātārjunīyam'?", "Bhāravi (भारविः)."], ["Who authored the 'Śiśupālavadham'?", "Māgha (माघः)."], ["What is the term for a king's donation of land for religious purposes, as seen in Verse 44?", "Agrahāra (अग्रहार)."], ["In Verse 41, what is 'astambhā toraṇasrajam'?", "A pillarless gateway-garland formed by flying cranes."], ["The 12th-century date of Śrī Harṣa makes him the _____ of the great classical mahākāvya poets.", "Latest (or last)."], ["The three-layer śleṣa on Sudakṣiṇā's name involves: (1) her name, (2) the sacrificial fee, and (3) _____.", "Dākṣiṇya (दाक्षिण्य — generosity/skill)."], ["In Verse 32, why does Dilīpa consider Sudakṣiṇā his only true wife despite the harem?", "Because of her nobility and firm-mindedness (Manasvini / मनस्विनी)."], ["What is 'haiyaṅgavīnam' (हैयङ्गवीनम्)?", "Butter made from the previous day's milk."], ["In Kālidāsa's journey vignette, which sense is engaged by the peacocks?", "The auditory sense (hearing)."], ["In Kālidāsa's journey vignette, which sense is engaged by the lotus-wind?", "The olfactory (smell) and tactile (touch) senses."], ["According to the analysis of Verse 42, why does the wind not disturb the king's turban or queen's hair?", "To maintain their ritual purity and show nature's favor."], ["Verse 34 describes the kingdom's administration as a 'heavy burden' (गुर्वी धुः) placed on the _____", "Shoulders (or arms) of the ministers."], ["The use of 'divyopamā' (divine simile) in Verse 36 serves to establish the couple's _____ status.", "Cosmic or divine."], ["Which 'Veda' includes the story of Nala and Damayantī used by Harṣa?", "None; it is from the Mahābhārata (Vana-parva)."], ["The phrase 'amogha āśiṣaḥ' in Verse 44 refers to blessings that are _____.", "Unfailing (always effective)."], ["In Verse 31, the word 'adhvara' (अध्वर) refers to a _____.", "Sacrifice (Yajña)."], ["What does Dilīpa's interest in 'vanyānāṃ mārgaśākhinām' reveal about his character?", "His ecological curiosity and absence of royal arrogance."], ["In Verse 40, the gazing deer are described as 'mṛgadvandveṣu', meaning _____.", "Deer couples."], ["How does Kālidāsa characterize Dilīpa's rule in relation to his subjects in Verse 24?", "He was their true father through protection and maintenance."], ["Which Sanskrit poet is celebrated for the quality of 'Upamā' (simile)?", "Kālidāsa (कालिदासः)."]];
let deck=[...DATA.keys()],idx=0;
const $=id=>document.getElementById(id);
function render(){
  const c=DATA[deck[idx]];
  $("qtext").textContent=c[0];
  $("atext").textContent=c[1];
  $("card").classList.remove("flipped");
  $("prev").disabled=idx===0;
  $("next").disabled=idx===deck.length-1;
  $("pf").style.width=((idx+1)/deck.length*100)+"%";
  $("pl").textContent=(idx+1)+" / "+deck.length;
}
function go(d){if(idx+d>=0&&idx+d<deck.length){idx+=d;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.random()*i+1|0;[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
$("scene").addEventListener("click",()=>$("card").classList.toggle("flipped"));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
});
render();
</script>
</body>
</html>
